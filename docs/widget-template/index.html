<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="/js/widget-theme.js?v=1"></script>
  <style>
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box }
    html,body { width:100%; height:100%; overflow:hidden; background:transparent;
      font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif; color:#e8e8ea }
    #root { width:100%; height:100%; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:4px }
    .n { font-size:34px; font-weight:600; letter-spacing:-0.5px }
    .l { font-size:12px; color:#8e8e93 }
    .i { max-width:100%; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    html[data-theme="light"] body { color:#1c1c1e }
    html[data-theme="light"] .l { color:#6c6c70 }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { poll } from '/js/widget-toolbox.js?v=1';

    const root = document.getElementById('root');

    poll({
      render: data => {
        root.replaceChildren();
        if (data.total != null) {
          const n = document.createElement('div');
          n.className = 'n';
          n.textContent = String(data.total);
          const l = document.createElement('div');
          l.className = 'l';
          l.textContent = data.total === 1 ? 'item' : 'items';
          root.append(n, l);
        }
        for (const item of data.items.slice(0, 3)) {
          const row = document.createElement('div');
          row.className = 'i';
          row.textContent = item.name;
          root.append(row);
        }
      },
      isEmpty: data => !data.items?.length,
      emptyText: 'Nothing here',
      interval: 30000,
    });
  </script>
</body>
</html>
