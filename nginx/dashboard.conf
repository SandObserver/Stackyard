server {
    listen 80;
    server_name _;

    # Alpine's packaged nginx.conf logs to files under /var/log/nginx, which
    # nothing reads and nothing rotates: the container ships no logrotate and no
    # cron. This covers request handling only.
    error_log stderr warn;
    access_log off;

    # Don't advertise the nginx version in the Server header or on error pages.
    server_tokens off;

    # Keep this above every limit the API enforces, so the API is always the
    # component that refuses an oversized request. Unset, nginx uses its 1 MB
    # default and silently becomes the strictest limit in the system. Not larger
    # than it needs to be either: a body is buffered before it is forwarded.
    client_max_body_size 3m;

    # Generated at container start from TRUSTED_PROXY. It makes $remote_addr the
    # real client rather than the front proxy, so rate limiting and audit logs
    # are per client without parsing a header here.
    include /etc/nginx/http.d/realip.conf;

    root /usr/share/nginx/html;

    # ── Security headers ──
    # HSTS is omitted: this listener is HTTP only. Add it at the TLS terminator.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include /etc/nginx/http.d/csp-default.conf;

    # ── PWA manifest ──
    location = /manifest.json {
        try_files /manifest.json =404;
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/http.d/csp-default.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type "application/manifest+json" always;
    }

    # ── apple-touch-icon ──
    # Served directly. The platform reads this path at add-to-homescreen time and does not
    # follow a redirect.
    location = /apple-touch-icon.png {
        alias /icons/favicon.png;
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /apple-touch-icon-precomposed.png {
        alias /icons/favicon.png;
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── Dashboard root ──
    location = / {
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/http.d/csp-default.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # ── Admin UI ──
    location ^~ /admin {
        try_files /admin/index.html =404;
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; font-src 'self'; frame-ancestors 'none';" always;
    }

    # ── Icons ──
    # User icons are mounted at /icons, outside the nginx root. `root /` maps the
    # request path straight onto that mount. Only this location reaches it, and
    # nginx resolves `..` before matching, so nothing above /icons/ is served.
    location /icons/ {
        root /;
        # Revalidate on every load, so a re-uploaded icon under the same name
        # appears immediately.
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/http.d/csp-default.conf;
        add_header Cache-Control "no-cache" always;
        # try_files, not error_page 404: a user with no icons of their own is the
        # normal case, and a failed open would log an error on every request.
        try_files $uri @icon_miss;
    }
    location @icon_miss {
        # Fall back to the icons bundled in the image.
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/http.d/csp-default.conf;
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }


    # ── Widget HTML files ──
    # X-Frame-Options is cleared so the dashboard can embed widgets. Keep
    # frame-ancestors 'self': without it these pages, the only ones allowed
    # inline script, could be framed by any site. style-src 'unsafe-inline' is
    # required by the widgets' DOM style assignments.
    location ^~ /widgets/ {
        try_files $uri =404;
        include /etc/nginx/http.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; font-src 'self'; frame-ancestors 'self';" always;
    }

    # ── API proxy ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        # $http_host, not $host: nginx strips the port from $host while a
        # browser's Origin keeps it, and the API compares the two.
        proxy_set_header Host $http_host;
        # Set both headers unconditionally, so a client-supplied value never
        # survives.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Leave X-Forwarded-Proto alone. This nginx never terminates TLS, so
        # $scheme is always http here, and setting it would overwrite the https a
        # front proxy sent and drop the Secure flag from the session cookie.
        include /etc/nginx/http.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # Give up after 15s and return 504 if Node hangs.
        proxy_read_timeout    15s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
    }

    # ── Health probe ──
    # Proxied to the API's public /health route, so the check exercises both
    # nginx and Node.
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        # $http_host, not $host: nginx strips the port from $host while a
        # browser's Origin keeps it, and the API compares the two.
        proxy_set_header Host $http_host;
        include /etc/nginx/http.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # ── Shared JS modules ──
    # Every reference to these carries a content hash, written into the source by
    # scripts/bump-cache-busting.js during the image build, so a changed file is
    # requested under a new URL. The pages that carry those references, index.html
    # and /admin, stay no-cache and are what makes an upgrade visible.
    location /js/ {
        try_files $uri =404;
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/http.d/csp-default.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Type "application/javascript";
    }

    # ── External CSS ──
    location /css/ {
        try_files $uri =404;
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/http.d/csp-default.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Type "text/css";
    }

    # ── Translation catalogs ──
    location /i18n/ {
        try_files $uri =404;
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/http.d/csp-default.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/json";
    }

    # ── Static assets (only in /icons/; JS and CSS have their own no-cache rules above) ──
    location ~* ^/icons/.*\.(woff2)$ {
        expires 1d;
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, immutable";
    }

    # ── No cache for HTML ──
    location ~* \.html$ {
        include /etc/nginx/http.d/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        include /etc/nginx/http.d/csp-default.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Compression ──
    # Do not list text/html: it is always compressed when gzip is on, and nginx
    # warns about the duplicate.
    #
    # Both JavaScript MIME types are listed. Which one nginx reports for .js
    # depends on the mime.types shipped with the build, so naming one would
    # silently stop compressing the frontend on a build that reports the other.
    gzip on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;
    gzip_min_length 256;
    # Without this, responses carry no Vary: Accept-Encoding and a shared cache
    # in front can hand a gzipped body to a client that never asked for one.
    gzip_vary on;
    # nginx decides a request is proxied by the presence of a Via header, so
    # this covers clients that arrived through a front proxy.
    gzip_proxied any;
}
