# Server-level security headers. nginx add_header does not inherit into a
# location that sets any add_header of its own, so every such location includes
# this file. X-Frame-Options is set per location. Content-Security-Policy comes
# from csp-default.conf, except in /admin and /widgets/.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
