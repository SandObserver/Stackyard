# Server-level security headers. nginx add_header does not inherit into a
# location that sets any add_header of its own, so every such location includes
# this file to restate them. X-Frame-Options is set per location and is not here.
# Content-Security-Policy is not here either: most locations include
# csp-default.conf, and /admin and /widgets/ set their own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
