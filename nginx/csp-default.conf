# The default Content-Security-Policy, for the dashboard and everything it
# loads. Included rather than repeated because nginx add_header does not inherit
# into a location that sets any add_header of its own, so every such location has
# to restate the policy. Nine sites did so verbatim.
#
# Two locations deliberately do NOT include this file, because their policy
# genuinely differs; both set their own Content-Security-Policy inline:
#   /admin      no Google Fonts, no frame-src
#   /widgets/   allows 'unsafe-inline' scripts
#
# frame-ancestors says who may frame us; frame-src says what we may frame. Both
# are here because both are the same everywhere this file is included.
# X-Frame-Options already says the same thing on these locations, but it is
# obsolete and no longer specified, so the policy is stated in the header
# browsers actually follow. A location that omits X-Frame-Options in future then
# still has a framing policy rather than none.
#
# Keep this to the one header. Anything that is not the same at every call site
# belongs in the location, not here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com https://cdn.jsdelivr.net; frame-src 'self'; frame-ancestors 'self'; connect-src 'self' https://api.unsplash.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com;" always;
