# The default Content-Security-Policy, for the dashboard and everything it
# loads. Included rather than repeated because nginx add_header does not inherit
# into a location that sets any add_header of its own, so every such location has
# to restate the policy. Nine sites did so verbatim.
#
# Two locations deliberately do NOT include this file, because their policy
# genuinely differs; both set their own Content-Security-Policy inline:
#   /admin      no Google Fonts, no frame-src
#   /widgets/   allows 'unsafe-inline' scripts
#
# Keep this to the one header. Anything that is not the same at every call site
# belongs in the location, not here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com https://cdn.jsdelivr.net; frame-src 'self'; connect-src 'self' https://api.unsplash.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com;" always;
