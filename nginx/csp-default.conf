# The default Content-Security-Policy. nginx add_header does not inherit into a
# location that sets any add_header of its own, so every such location includes
# this file.
#
# Two locations set their own policy inline instead:
#   /admin      no Google Fonts, no frame-src
#   /widgets/   allows 'unsafe-inline' scripts
#
# frame-ancestors says who may frame us, frame-src what we may frame.
# X-Frame-Options says the same thing but is obsolete, so a location that drops
# it still has a framing policy.
#
# Keep this to the one header. Anything that differs per call site belongs in
# the location.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com https://cdn.jsdelivr.net; frame-src 'self'; frame-ancestors 'self'; connect-src 'self' https://api.unsplash.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com;" always;
