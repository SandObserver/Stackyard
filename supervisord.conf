[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startretries=3
startsecs=2

[program:api]
command=node /app/api/src/server.js
directory=/app/api
user=node
autostart=true
autorestart=true
priority=20
environment=NODE_ENV="production",CONFIG_PATH="/data/apps.json",ICONS_PATH="/icons",PORT="3000",HOME="/home/node"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startretries=3
startsecs=3

; Shut the container down when a program cannot be started at all.
;
; supervisord gives up on a program after startretries and marks it FATAL, then
; keeps running because the other program is still alive. The container stayed up
; with a dead API inside it and never recovered: Docker's healthcheck marks it
; unhealthy, but `restart: unless-stopped` restarts a container that exits, not
; one that is merely unhealthy.
;
; See scripts/exit-on-fatal.py.
[eventlistener:exit-on-fatal]
command=/usr/bin/python3 /app/scripts/exit-on-fatal.py
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
