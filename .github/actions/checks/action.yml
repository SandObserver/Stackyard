name: Project checks
description: >
  Every check that decides whether the tree is releasable. One definition, used
  by the Tests workflow and by the release build, so the two cannot drift and a
  tag cannot publish something the checks never saw.

inputs:
  mode:
    description: >
      "test" is the pull-request and main path: verify the committed tree and
      smoke-build the image.

      "release" adds the cache-busting stamp pass a release needs, after the
      tests rather than before. Stamping writes entryVersions into each widget
      manifest, and widget-manifests.test.js asserts that field is never
      committed, so the suite has to run on the committed tree. The stamp pass
      then runs, and is checked for convergence. No smoke build in this mode:
      the real multi-platform build follows immediately.
    required: false
    default: test

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'

    - name: Install dev tooling
      shell: bash
      run: npm install

    - name: Check asset cache-busting
      shell: bash
      run: node scripts/bump-cache-busting.js --check

    # Both entries per module, plain and cache-busted. See the script's header:
    # a missing one leaves that module silently unchecked by typecheck:ui.
    - name: Check frontend path map
      shell: bash
      run: npm run paths:check

    - name: Run backend tests
      shell: bash
      working-directory: api
      run: npm test

    # Reads the run above. The floor sits a few points under the real figure so
    # ordinary movement does not fail a PR; raise it when coverage rises, never
    # to meet a number a change happens to hit.
    - name: Check backend coverage
      shell: bash
      working-directory: api
      run: npx c8 check-coverage --lines 92

    - name: Run frontend tests
      shell: bash
      working-directory: ui/test
      run: node --test

    - name: Lint
      shell: bash
      run: npm run lint

    - name: Typecheck (backend)
      shell: bash
      run: npm run typecheck

    - name: Typecheck (frontend)
      shell: bash
      run: npm run typecheck:ui

    # Only on the test path. A release runs the real build right after this, so
    # building twice would just double a slow multi-platform step.
    - name: Docker build smoke test
      if: inputs.mode == 'test'
      shell: bash
      run: docker build -t stackyard:ci .

    # Release only, and last: this rewrites files. --check above proves every
    # asset reference carries a stamp, but not that the stamp is current, so
    # this pass is what makes the shipped stamps correct.
    - name: Stamp asset cache-busting
      if: inputs.mode == 'release'
      shell: bash
      run: node scripts/bump-cache-busting.js

    # Stamping must be reproducible. The two passes are compared with each other,
    # not against the committed tree: the stamp pass always changes files, so
    # measuring against HEAD would read intended work as a failure to converge.
    - name: Verify stamping is settled
      if: inputs.mode == 'release'
      shell: bash
      run: |
        git diff > "$RUNNER_TEMP/stamped.diff"
        node scripts/bump-cache-busting.js
        git diff > "$RUNNER_TEMP/settled.diff"
        if ! diff -q "$RUNNER_TEMP/stamped.diff" "$RUNNER_TEMP/settled.diff" >/dev/null; then
          echo "::error::Cache-busting stamps did not converge; a second pass still changed files."
          diff -u "$RUNNER_TEMP/stamped.diff" "$RUNNER_TEMP/settled.diff" | head -50
          exit 1
        fi
