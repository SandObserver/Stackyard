name: Project checks
description: >
  Every check that decides whether the tree is releasable. One definition, used
  by the Tests workflow and by the release build, so the two cannot drift and a
  tag cannot publish something the checks never saw.

inputs:
  mode:
    description: >
      "test" is the pull-request and main path: verify the committed tree and
      smoke-build the image.

      "release" adds the cache-busting stamp pass a release needs, after the
      tests rather than before. Stamping writes entryVersions into each widget
      manifest, and widget-manifests.test.js asserts that field is never
      committed, so the suite has to run on the committed tree. The stamp pass
      then runs, and is checked for convergence. No smoke build in this mode:
      the real multi-platform build follows immediately.
    required: false
    default: test

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    - name: Install dev tooling
      shell: bash
      run: npm ci --ignore-scripts

    # Structure fails here; style prints warnings on the pull request.
    - name: Check the changelog
      shell: bash
      run: node scripts/changelog-check.js

    # A release must also agree with itself: the newest dated section and the
    # package version name one version, and nothing is left under [Unreleased].
    - name: Check the changelog describes this release
      if: inputs.mode == 'release'
      shell: bash
      run: node scripts/changelog-check.js --release "$(node -p "require('./api/package.json').version")"

    - name: Check asset cache-busting
      shell: bash
      run: node scripts/bump-cache-busting.js --check

    # Both entries per module, plain and cache-busted. See the script's header:
    # a missing one leaves that module silently unchecked by typecheck:ui.
    - name: Check frontend path map
      shell: bash
      run: npm run paths:check

    - name: Run backend tests
      shell: bash
      working-directory: api
      run: npm test

    # Reads the run above. The floor sits a few points under the real figure so
    # ordinary movement does not fail a PR; raise it when coverage rises, never
    # to meet a number a change happens to hit.
    - name: Check backend coverage
      shell: bash
      working-directory: api
      run: npx c8 check-coverage --lines 92

    - name: Run frontend tests
      shell: bash
      working-directory: ui/test
      run: node --test

    - name: Run repository tests
      shell: bash
      working-directory: test/repo
      run: node --test

    - name: Lint
      shell: bash
      run: npm run lint

    - name: Check formatting
      shell: bash
      run: npm run format:check

    - name: Audit the workflows
      uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        version: 1.32.0
        advanced-security: false

    - name: Typecheck (backend)
      shell: bash
      run: npm run typecheck

    - name: Typecheck (frontend)
      shell: bash
      run: npm run typecheck:ui

    # Only on the test path. A release runs the real build right after this, so
    # building twice would just double a slow multi-platform step.
    - name: Docker build smoke test
      if: inputs.mode == 'test'
      shell: bash
      run: docker build -t stackyard:ci .

    # Keep the severity and ignore-unfixed the same as the release gate.
    - name: Scan the image
      if: inputs.mode == 'test'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: stackyard:ci
        format: table
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'

    # Keep these after the amd64 build. Buildx becomes the default builder, and
    # the amd64 image then never reaches the local daemon for its scan.
    - name: Set up QEMU
      if: inputs.mode == 'test'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

    - name: Set up Docker Buildx
      if: inputs.mode == 'test'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

    - name: Build arm64
      if: inputs.mode == 'test'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/arm64
        load: true
        push: false
        tags: stackyard:ci-arm64

    - name: Scan the arm64 image
      if: inputs.mode == 'test'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: stackyard:ci-arm64
        format: table
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'

    - name: Start the arm64 image
      if: inputs.mode == 'test'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/arm64-data" "$RUNNER_TEMP/arm64-icons"
        chmod 777 "$RUNNER_TEMP/arm64-data" "$RUNNER_TEMP/arm64-icons"
        docker run -d --name stackyard-arm64 --platform linux/arm64 \
          -p 8733:80 \
          -v "$RUNNER_TEMP/arm64-data:/data" \
          -v "$RUNNER_TEMP/arm64-icons:/icons" \
          stackyard:ci-arm64
        status=1
        for i in $(seq 1 120); do
          if curl -fsS http://127.0.0.1:8733/health >/dev/null 2>&1; then echo "healthy after ${i}s"; status=0; break; fi
          sleep 1
        done
        [ "$status" = 0 ] || { echo "::error::the arm64 image never became healthy"; docker logs stackyard-arm64; }
        docker rm -f stackyard-arm64 >/dev/null
        exit "$status"

    # Release only, and last: this rewrites files. --check above proves every
    # asset reference carries a stamp, but not that the stamp is current, so
    # this pass is what makes the shipped stamps correct.
    - name: Stamp asset cache-busting
      if: inputs.mode == 'release'
      shell: bash
      run: node scripts/bump-cache-busting.js

    # Stamping must be reproducible. The two passes are compared with each other,
    # not against the committed tree: the stamp pass always changes files, so
    # measuring against HEAD would read intended work as a failure to converge.
    - name: Verify stamping is settled
      if: inputs.mode == 'release'
      shell: bash
      run: |
        git diff > "$RUNNER_TEMP/stamped.diff"
        node scripts/bump-cache-busting.js
        git diff > "$RUNNER_TEMP/settled.diff"
        if ! diff -q "$RUNNER_TEMP/stamped.diff" "$RUNNER_TEMP/settled.diff" >/dev/null; then
          echo "::error::Cache-busting stamps did not converge; a second pass still changed files."
          diff -u "$RUNNER_TEMP/stamped.diff" "$RUNNER_TEMP/settled.diff" | head -50
          exit 1
        fi
