version: 2
# Only non-breaking upgrades are proposed automatically: minor and patch.
# Major bumps (e.g. Node 24 to 26, TypeScript 6 to 7) are ignored and taken by
# hand when you choose, so you never have to review a breaking change on Dependabot's schedule.
updates:
  # CI tooling (Biome, TypeScript, @types/node). These are the only npm deps; the runtime has none.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base image. The Dockerfile pins it by digest, which is what gives this entry
  # something to raise: a bare `26-alpine` never changes version, so nothing on
  # the 26 line is ever proposed. Major moves stay manual under the ignore below.
  # Node security fixes reach the image only through this digest. Keep the check
  # daily and the cooldown short. A longer delay ships a Node CVE that has a fix.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Pinned GitHub Actions. `/` covers the workflows only; each composite action
  # directory must be listed or its pins are never updated.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/checks
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
