name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A tag must not publish an image the browser tests reject. Two minutes, and
  # the same workflow that runs on pull requests, rather than a copy of it.
  e2e:
    uses: ./.github/workflows/e2e.yml

  build-and-push:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing exchanges this for a short-lived Sigstore certificate.
      # No key material is stored anywhere.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Every check the Tests workflow runs, plus the stamp pass, before anything
      # publishes. On failure the tag stays with nothing published: fix main,
      # delete the tag, tag again.
      - name: Run project checks
        uses: ./.github/actions/checks
        with:
          mode: release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is a mirror, and entirely optional: with no credentials set
      # the release publishes to ghcr.io exactly as before.
      #
      # One step decides, and both the login and the tag list read its answer.
      # Deciding twice, once in an `if:` and once here, is how a build ends up
      # pushing to a registry it never logged in to.
      - name: Choose registries
        id: registries
        env:
          # A variable, not a secret: a username is not sensitive, and as a
          # secret it was masked everywhere in the logs, including in the ghcr
          # tags, which share the name. Only the token is secret.
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo 'dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerhub=false' >> "$GITHUB_OUTPUT"
            echo 'No Docker Hub credentials set; publishing to ghcr.io only.'
          fi
          {
            echo 'images<<REGISTRY_LIST'
            echo 'ghcr.io/sandobserver/stackyard'
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}/stackyard"
            fi
            echo REGISTRY_LIST
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A hyphen in the ref used to decide this. See scripts/is-prerelease.js:
      # build metadata can contain a hyphen, and a mistyped tag has none, which
      # is the case that quietly moved `latest`.
      - name: Classify the tag
        id: tag
        run: node scripts/is-prerelease.js "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.tag.outputs.prerelease == 'false' }}

      # A multi-platform image is assembled by buildx and never exists locally,
      # so scanning what gets pushed means pushing it first. One platform does
      # load, and the layer cache carries it into the real build below, so the
      # gate costs a cache-warm rebuild rather than a second full build.
      #
      # linux/arm64 cannot be loaded on an x86 runner and so is still published
      # unscanned. It shares this image's base and package set; what it does not
      # share is architecture-specific package versions.
      - name: Build for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: stackyard:scan
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stackyard:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Everything below addresses the image by digest: a tag can be moved.

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless, so the signature is bound to this workflow's identity and there
      # is no key to hold. Verification steps: docs/security.md.
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/sandobserver/stackyard@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/sandobserver/stackyard@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: stackyard-${{ steps.meta.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.meta.outputs.version }}
          path: stackyard-${{ steps.meta.outputs.version }}.spdx.json
          if-no-files-found: error
