name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A tag must not publish an image the browser tests reject.
  e2e:
    uses: ./.github/workflows/e2e.yml

  build-and-push:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
      # Exchanged for a short-lived Sigstore certificate by keyless signing.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs before anything publishes. On failure the tag stays with nothing
      # published: fix main, delete the tag, tag again.
      - name: Run project checks
        uses: ./.github/actions/checks
        with:
          mode: release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional. Decide once here. The login and the tag list must
      # read this output, or a build pushes to a registry it never logged in to.
      - name: Choose registries
        id: registries
        env:
          # Keep this a variable. As a secret it masks the ghcr tags, which share
          # the name. Only the token is secret.
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo 'dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerhub=false' >> "$GITHUB_OUTPUT"
            echo 'No Docker Hub credentials set; publishing to ghcr.io only.'
          fi
          {
            echo 'images<<REGISTRY_LIST'
            echo 'ghcr.io/sandobserver/stackyard'
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}/stackyard"
            fi
            echo REGISTRY_LIST
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Do not decide this on a hyphen in the ref. It moves `latest` to a
      # pre-release. See scripts/is-prerelease.js.
      - name: Classify the tag
        id: tag
        run: node scripts/is-prerelease.js "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.tag.outputs.prerelease == 'false' }}

      # A multi-platform image never exists locally, so each platform is built
      # and scanned here before anything is pushed. Keep both scans. Package
      # versions differ by architecture.
      - name: Build amd64 for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: stackyard:scan-amd64
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Scan the amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stackyard:scan-amd64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build arm64 for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: stackyard:scan-arm64
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Scan the arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stackyard:scan-arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Everything below addresses the image by digest. A tag can be moved.

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless. Verification steps: docs/security.md.
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/sandobserver/stackyard@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/sandobserver/stackyard@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: stackyard-${{ steps.meta.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Keep this before the Docker Hub steps. A failure there must not cost the
      # release its SBOM.
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.meta.outputs.version }}
          path: stackyard-${{ steps.meta.outputs.version }}.spdx.json
          if-no-files-found: error

      # The artifact above expires, so the same document is attested to the
      # registry by digest. Verification steps: docs/security.md.
      - name: Attest the SBOM to the registry
        run: |
          cosign attest --yes \
            --predicate "stackyard-${VERSION}.spdx.json" \
            --type spdxjson \
            "ghcr.io/sandobserver/stackyard@${DIGEST}"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # After the push, and stable tags only. A pre-release must not rewrite the
      # page describing `latest`.
      - name: Generate the Docker Hub description
        if: steps.registries.outputs.dockerhub == 'true' && steps.tag.outputs.prerelease == 'false'
        run: node scripts/dockerhub-description.js > dockerhub-description.md

      - name: Update the Docker Hub description
        if: steps.registries.outputs.dockerhub == 'true' && steps.tag.outputs.prerelease == 'false'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          # Needs a token permitted to edit repository metadata. A push token
          # returns 403.
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}/stackyard
          readme-filepath: dockerhub-description.md
          short-description: A self-hosted homelab dashboard you actually want to look at.

  # The only gate that reads the published image. It cannot unpublish a bad one,
  # but it stops the release page and the downstream updates describing it.
  verify-published:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The commands docs/security.md tells a reader to run.
      - name: Verify the signature
        run: |
          cosign verify "ghcr.io/sandobserver/stackyard@${DIGEST}" \
            --certificate-identity-regexp '^https://github.com/SandObserver/Stackyard/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}

      # Redirect the payload. It is one line of about two megabytes, and the
      # log stream stalls on it until the job times out.
      - name: Verify the SBOM attestation
        run: |
          cosign verify-attestation "ghcr.io/sandobserver/stackyard@${DIGEST}" \
            --type spdxjson \
            --certificate-identity-regexp '^https://github.com/SandObserver/Stackyard/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > attestation.json
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pulled by digest and started the way a user starts it.
      - name: Start the published image
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/icons"
          chmod 777 "$RUNNER_TEMP/data" "$RUNNER_TEMP/icons"
          docker run -d --name stackyard-verify \
            -p 8732:80 \
            -v "$RUNNER_TEMP/data:/data" \
            -v "$RUNNER_TEMP/icons:/icons" \
            "ghcr.io/sandobserver/stackyard@${DIGEST}"
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}

      - name: Check it answers
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8732/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the published image never became healthy"
          docker logs stackyard-verify
          exit 1

  # Runs after the image is published and verified, so the page never describes
  # something unpublished or broken.
  release-page:
    needs: verify-published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Use the app token. A release published with GITHUB_TOKEN starts no
      # workflow run, and the Community Applications update listens for one.
      - name: Mint a token for the release app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Classify the tag
        id: tag
        run: node scripts/is-prerelease.js "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # The notes are the changelog section, so the page and the file cannot
      # describe the release differently.
      - name: Publish the release page
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release page."
            exit 0
          fi
          node scripts/release-notes.js "$TAG" > release-notes.md
          if [ "$PRERELEASE" = 'true' ]; then
            FLAG=--prerelease
          else
            FLAG=--latest
          fi
          gh release create "$TAG" \
            --title "${TAG#v}" \
            --notes-file release-notes.md \
            --verify-tag \
            "$FLAG"

  # The documentation site generates its changelog, its development page and its
  # release badge from this repository at build time. Its host builds only on a
  # push to its own repository, so without this it keeps serving the previous
  # release until something unrelated is pushed there.
  docs-rebuild:
    needs: release-page
    if: needs.release-page.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Request a documentation site rebuild
        env:
          HOOK: ${{ secrets.DOCS_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then
            echo 'DOCS_DEPLOY_HOOK_URL is not set. Nothing requested.'
            exit 0
          fi
          # Never print the hook. The URL is the credential.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --max-time 30 "$HOOK")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "The deploy hook answered HTTP $code."
            exit 1
          fi
          echo 'Documentation site rebuild requested.'
