name: End-to-end

# A required check. Do not filter it by path or skip the job. A required check
# that never starts blocks a pull request forever. A skipped job passes it
# untested.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # Called by the release workflow.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every later step runs unless this step outputs 'false'. Add a path below
      # only if neither the image nor the specs read it. The API lists at most
      # 3000 files, so a larger pull request runs everything.
      - name: Find what the change can affect
        id: changes
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            e2e:
              - '**'
              - '!*.md'
              - '!LICENSE'
              - '!NOTICE'
              - '!.editorconfig'
              - '!.gitignore'
              - '!.git-blame-ignore-revs'
              - '!docs/**'
              - '!.github/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/dependabot.yml'
              - '!.github/actions/checks/**'
              - '!.github/workflows/ca-template-changes.yml'
              - '!.github/workflows/ca-template-check.yml'
              - '!.github/workflows/changelog.yml'
              - '!.github/workflows/codeql.yml'
              - '!.github/workflows/demo.yml'
              - '!.github/workflows/release-prep.yml'
              - '!.github/workflows/release-tag.yml'
              - '!.github/workflows/release.yml'
              - '!.github/workflows/scan-published.yml'
              - '!.github/workflows/test.yml'
              - '!api/test/**'
              - '!api/test-support/**'
              - '!api/.c8rc.json'
              - '!ui/test/**'
              - '!test/**'
              - '!templates/**'
              - '!ca_profile.xml'
              - '!scripts/demo/**'
              - '!scripts/ca-changes.js'
              - '!scripts/ca-validate.py'
              - '!scripts/changelog-check.js'
              - '!scripts/changelog-merged-pr.sh'
              - '!scripts/changelog-pr.js'
              - '!scripts/changelog-push.sh'
              - '!scripts/changelog.js'
              - '!scripts/check-frontend-paths.js'
              - '!scripts/clock-fonts.py'
              - '!scripts/dockerhub-description.js'
              - '!scripts/is-prerelease.js'
              - '!scripts/node-security.js'
              - '!scripts/release-notes.js'
              - '!scripts/release-prep.js'
              - '!biome.json'
              - '!tsconfig.json'
              - '!tsconfig.frontend.json'
              - '!docker-compose.yml'
              - '!docker-compose.dev.yml'

      - name: Set up Node.js
        if: steps.changes.outputs.e2e != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dev tooling
        if: steps.changes.outputs.e2e != 'false'
        run: npm ci --ignore-scripts

      - name: Read the runner image and the Playwright version
        if: steps.changes.outputs.e2e != 'false'
        id: image
        run: |
          echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      # Keep the runner OS release in the key. Playwright skips a browser whose
      # folder exists, so a build for another Ubuntu release fails to launch.
      - name: Cache Playwright browsers
        if: steps.changes.outputs.e2e != 'false'
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ steps.image.outputs.os }}-

      # No restore-keys. A partial hit installs an older package set and skips
      # --with-deps, so browsers that need a new package fail to launch.
      - name: Cache system packages for the browsers
        if: steps.changes.outputs.e2e != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ steps.image.outputs.version }}-playwright-${{ steps.image.outputs.playwright }}

      - name: Install browsers
        if: steps.changes.outputs.e2e != 'false'
        run: |
          debs="$HOME/.cache/apt-archives"
          if ls "$debs"/*.deb >/dev/null 2>&1 && sudo dpkg -i "$debs"/*.deb; then
            npx playwright install chromium webkit
          else
            sudo apt-get -f install -y
            echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs >/dev/null
            npx playwright install --with-deps chromium webkit
            rm -rf "$debs" && mkdir -p "$debs"
            cp /var/cache/apt/archives/*.deb "$debs"/
          fi

      # The image that ships, so nginx and its headers are part of what is
      # tested. A bug this project has already had, an inline handler refused by
      # the Content-Security-Policy, is invisible without them.
      - name: Build the image
        if: steps.changes.outputs.e2e != 'false'
        run: docker build -t stackyard:e2e .

      - name: Start the container
        if: steps.changes.outputs.e2e != 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/icons"
          chmod 777 "$RUNNER_TEMP/data" "$RUNNER_TEMP/icons"
          docker run -d --name stackyard-e2e \
            -p 8730:80 \
            -v "$RUNNER_TEMP/data:/data" \
            -v "$RUNNER_TEMP/icons:/icons" \
            stackyard:e2e
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8730/health >/dev/null 2>&1; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::the container never became healthy"
          docker logs stackyard-e2e
          exit 1

      - name: Run the specs
        if: steps.changes.outputs.e2e != 'false'
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:8730

      - name: Stop and restart the container
        if: steps.changes.outputs.e2e != 'false'
        run: |
          before=$(docker exec stackyard-e2e sha256sum /data/apps.json)
          docker stop -t 30 stackyard-e2e
          code=$(docker inspect -f '{{.State.ExitCode}}' stackyard-e2e)
          echo "stopped with exit code ${code}"
          if [ "$code" = 137 ]; then
            echo "::error::the container ignored SIGTERM and was killed"
            exit 1
          fi
          docker start stackyard-e2e
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8730/health >/dev/null 2>&1; then echo "up again after ${i}s"; break; fi
            if [ "$i" = 60 ]; then echo "::error::the container never became healthy after a restart"; exit 1; fi
            sleep 1
          done
          after=$(docker exec stackyard-e2e sha256sum /data/apps.json)
          if [ "$before" != "$after" ]; then
            echo "::error::the restart changed the saved config"
            exit 1
          fi

      - name: Start with reduced privileges
        if: steps.changes.outputs.e2e != 'false'
        run: |
          check() {
            name=$1 port=$2; shift 2
            docker run -d --name "$name" -p "$port" \
              --tmpfs /data:mode=1777 --tmpfs /icons:mode=1777 "$@" stackyard:e2e
            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port%%:*}/health" >/dev/null 2>&1; then echo "$name up after ${i}s"; break; fi
              if [ "$i" = 60 ]; then echo "::error::$name never became healthy"; docker logs "$name"; exit 1; fi
              sleep 1
            done
            docker rm -f "$name" >/dev/null
          }
          check stackyard-any-user 8731:8080 --user 4242:4242 --read-only --tmpfs /run/stackyard \
            --cap-drop ALL --security-opt no-new-privileges -e LISTEN_PORT=8080
          check stackyard-no-chown 8732:80 --user 0:0 --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add KILL --cap-add NET_BIND_SERVICE

      - name: Container logs on failure
        if: failure()
        run: docker logs stackyard-e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop the container
        if: always()
        run: docker rm -f stackyard-e2e || true
