name: VEX

on:
  workflow_call:
    inputs:
      digest:
        type: string
        required: true
      version:
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published version, for example 1.20.0
        type: string
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A failed or hung Scout call must not fail a published release.
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
      IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}/stackyard
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve the image
        run: |
          case "$VERSION" in
            *[!0-9A-Za-z.-]* | '' | -* ) echo "not a version: '$VERSION'"; exit 1 ;;
          esac
          if [ -z "$DIGEST" ]; then
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          fi
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "no image for ${IMAGE}:${VERSION}"; exit 1 ;;
          esac
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
        env:
          DIGEST: ${{ inputs.digest }}

      # Every statement must hold for the image it is attached to. A false one
      # hides a real vulnerability from users. Keep the musl check.
      - name: Prepare the VEX statements
        run: |
          for arch in amd64 arm64; do
            digest=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" |
              jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')
            [ -n "$digest" ] || { echo "no linux/$arch image in $DIGEST"; exit 1; }
            cid=$(docker create --platform "linux/$arch" "${IMAGE}@${digest}")
            musl=$(docker cp "$cid:/lib/apk/db/installed" - | tar -xO |
              awk '/^P:/ { p = substr($0, 3) } /^V:/ && p == "musl" { print substr($0, 3) }')
            docker rm "$cid" > /dev/null
            if [ -z "$musl" ] || [ "$(printf '%s\n' "$MUSL_FIXED" "$musl" | sort -V | head -n 1)" != "$MUSL_FIXED" ]; then
              echo "linux/$arch ships musl '${musl}', older than $MUSL_FIXED. Not attaching."
              exit 1
            fi
            jq --arg id "https://github.com/SandObserver/Stackyard/releases/tag/${TAG}#vex-${arch}" \
              --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg product "pkg:docker/${IMAGE#docker.io/}@${VERSION}" \
              --arg musl "$musl" --arg fixed "$MUSL_FIXED" \
              '."@id" = $id | .timestamp = $now
                | .statements[] |= (.products = [{"@id": $product}] | .timestamp = $now
                  | .impact_statement = "This image ships musl \($musl). Alpine 3.24 ships the fix in musl \($fixed).")' \
              .github/vex/stackyard.vex.json > "$RUNNER_TEMP/stackyard-$arch.vex.json"
            echo "$digest" > "$RUNNER_TEMP/digest-$arch"
          done
        env:
          MUSL_FIXED: 1.2.6-r3

      # Keep --referrer. Attaching into the index changes the image digest, and
      # the signature no longer matches it.
      - name: Attach the VEX statements
        run: |
          for arch in amd64 arm64; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -e HOME=/tmp -e DOCKER_SCOUT_NO_CACHE=true \
              -e DOCKER_SCOUT_HUB_USER -e DOCKER_SCOUT_HUB_PASSWORD \
              -e DOCKER_CONFIG=/docker-config -v "$HOME/.docker:/docker-config:ro" \
              -v "$RUNNER_TEMP:/vex:ro" \
              "$SCOUT_IMAGE" attestation add \
              --org "$NAMESPACE" \
              --file "/vex/stackyard-$arch.vex.json" \
              --predicate-type https://openvex.dev/ns/v0.2.0 \
              --referrer \
              "registry://${IMAGE#docker.io/}@$(cat "$RUNNER_TEMP/digest-$arch")"
          done
        env:
          # Pin by digest. This program holds the Docker Hub token.
          SCOUT_IMAGE: docker.io/docker/scout-cli:1.26.0@sha256:ae97866ffbcc23a9bdb28beb3f11b46fa5f8b77380121f74b0eabfb637d63360
          DOCKER_SCOUT_HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
