name: Scan the published image

# Scans the published image, not a rebuild. A failure means the image people are
# running is affected.
on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.digest.outputs.ref }}
    steps:
      - name: Resolve the published digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "Scanning $IMAGE@$digest"
        env:
          IMAGE: ghcr.io/sandobserver/stackyard

  scan:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both published platforms, and one failing must not hide the other.
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      # Keep the severity and ignore-unfixed the same as the release gate.
      - name: Scan it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.resolve.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: ${{ matrix.platform }}

      - name: Check out the repository
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up QEMU
        if: ${{ !cancelled() && matrix.platform != 'linux/amd64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      # Ask the binary. The image is built from scratch and carries no NODE_VERSION.
      - name: Check the image's Node.js for missed security releases
        if: ${{ !cancelled() }}
        run: |
          version=$(docker run --rm --platform "$PLATFORM" --entrypoint node \
            "$IMAGE_REF" -p process.versions.node)
          node scripts/node-security.js "$version"
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_REF: ${{ needs.resolve.outputs.ref }}
