name: Scan the published image

# Scans the published image, not a rebuild. A failure means the image people are
# running is affected.
on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both published platforms, and one failing must not hide the other.
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Pull the published image
        run: docker pull --platform "$PLATFORM" ghcr.io/sandobserver/stackyard:latest
        env:
          PLATFORM: ${{ matrix.platform }}

      # Keep the severity and ignore-unfixed the same as the release gate.
      - name: Scan it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/sandobserver/stackyard:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Check out the repository
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check the image's Node.js for missed security releases
        if: ${{ !cancelled() }}
        run: |
          version=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
            ghcr.io/sandobserver/stackyard:latest | sed -n 's/^NODE_VERSION=//p')
          node scripts/node-security.js "$version"
