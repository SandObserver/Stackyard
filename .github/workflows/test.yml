name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The checks live in a composite action so the release build runs exactly
      # the same set and the two cannot drift. See .github/actions/checks.
      - name: Run project checks
        uses: ./.github/actions/checks
        with:
          mode: test
