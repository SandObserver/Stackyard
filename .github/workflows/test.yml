name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# The repository default is write, and this job runs npm install and a docker
# build, so dependency code executes next to the token. It only needs to read
# the tree.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The checks live in a composite action so the release build runs exactly
      # the same set and the two cannot drift. See .github/actions/checks.
      - name: Run project checks
        uses: ./.github/actions/checks
        with:
          mode: test
