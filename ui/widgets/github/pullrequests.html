<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Pull Requests</title>
<script src="/js/widget-theme.js?v=db11b06d"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1C1C1E;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; }

  .widget { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 13px; }
  .widget.size-medium { flex-direction: row; gap: 20px; }
  .head { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .size-small .head, .size-medium .head { flex: 1; justify-content: space-between; }
  .size-medium .head { flex: 0 0 124px; }
  .lbl { font-size: 14px; font-weight: 600; color: #8E8E93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fig { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .num { font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; color: #FFFFFF; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; }
  .size-small .num { font-size: 44px; }
  .size-medium .num { font-size: 40px; }
  .size-large .num { font-size: 50px; }
  .sub { height: 18px; font-size: 14px; line-height: 18px; color: #8E8E93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .list { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 13px; }
  .size-medium .list { justify-content: center; gap: 7px; }
  .pr { display: flex; flex-direction: column; gap: 2px; min-width: 0; border-radius: 6px; }
  .title, .repo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-size: 14px; font-weight: 500; line-height: 1.3; color: #FFFFFF; }
  .repo { font-size: 12px; line-height: 1.3; color: #8E8E93; }
  .none { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 14px; color: #8E8E93; }

  .clickable { cursor: pointer; border-radius: 8px; }
  .clickable:focus-visible { outline: 2px solid #0091FF; outline-offset: 4px; }
  .wt-inert .clickable, .clickable.wt-inert { pointer-events: auto; }
  .cap { justify-content: center; }

  .arrive .num, .arrive .list { animation: fade 0.25s ease-out both; }
  @keyframes fade { from { opacity: 0; } }

  html[data-theme="light"], html[data-theme="light"] body { background: #FFFFFF; }
  html[data-theme="light"] .num, html[data-theme="light"] .title { color: #000000; }
  html[data-theme="light"] .lbl, html[data-theme="light"] .sub,
  html[data-theme="light"] .repo, html[data-theme="light"] .none { color: #6C6C70; }

  @media (prefers-reduced-motion: reduce) {
    .arrive .num, .arrive .list { animation: none; }
  }
</style>
</head>
<body>
<div class="widget" id="widget" role="group" aria-label="GitHub pull requests"></div>
<div class="cap" id="cap"></div>
<script type="module">
import { poll, fetchData, linkTo, loadStrings, wt, errorState, formatNumber, fitText } from '/js/widget-toolbox.js?v=556ee947';
await loadStrings();

const TICK_MS = 60000;
const params = new URLSearchParams(location.search);
const id = params.get('id') || '';
const MOBILE = params.get('mobile') === '1';
const size = ['small', 'medium', 'large'].includes(params.get('size')) ? params.get('size') : 'medium';
const ROWS = { small: 0, medium: 3, large: 4 }[size];
const FILTER_FALLBACK = { created: 'Created', assigned: 'Assigned', mentioned: 'Mentioned', 'review-requested': 'Review requested' };

const w = document.getElementById('widget');
w.setAttribute('aria-label', wt('ui.prAria', 'GitHub pull requests'));
let user = '';
let arrived = false;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

const RTL_LETTER = /[\p{Script=Arabic}\p{Script=Hebrew}\p{Script=Syriac}\p{Script=Thaana}\p{Script=Nko}]/u;
function line(cls, text) {
  const n = el('div', cls, text);
  const first = String(text).match(/\p{L}/u);
  n.dir = first && RTL_LETTER.test(first[0]) ? 'rtl' : 'ltr';
  return n;
}

const head = el('div', 'head');
const fig = el('div', 'fig');
const num = el('div', 'num', '—');
const sub = el('div', 'sub');
fig.append(num, sub);
head.append(el('div', 'lbl', wt('ui.pullRequests', 'Pull requests')), fig);
const list = el('div', 'list');
w.className = 'widget size-' + size;
w.append(head);
if (ROWS) w.append(list);

const state = errorState({ root: document.body, caption: document.getElementById('cap'), content: () => [w] });

function repoName(repo) {
  const own = user.toLowerCase() + '/';
  return user && String(repo).toLowerCase().startsWith(own) ? String(repo).slice(own.length) : String(repo);
}

function render(data) {
  const total = formatNumber(Math.max(0, Number(data.totalCount) || 0));
  const filters = Array.isArray(data.filters) && data.filters.length ? data.filters : ['created'];
  const label = filters.map(f => wt('githubPrFilters.opt.' + f, FILTER_FALLBACK[f] || f)).join(', ');
  num.textContent = total;
  fitText(num);
  sub.textContent = label;
  const target = MOBILE && !ROWS ? w : head;
  if (linkTo(target, data.allUrl))
    target.setAttribute(
      'aria-label',
      `${wt('ui.pullRequests', 'Pull requests')}, ${total} ${label}, ${wt('ui.viewAll', 'view all')}`,
    );
  if (!arrived) {
    arrived = true;
    w.classList.add('arrive');
    setTimeout(() => w.classList.remove('arrive'), 600);
  }
  if (!ROWS) return;

  const items = (Array.isArray(data.items) ? data.items : []).filter(pr => pr && typeof pr === 'object' && (pr.title || pr.number)).slice(0, ROWS);
  list.replaceChildren();
  if (!items.length) {
    list.removeAttribute('role');
    list.append(el('div', 'none', wt('ui.noPrs', 'No open pull requests')));
    return;
  }
  list.setAttribute('role', 'list');
  for (const pr of items) {
    const item = el('div');
    item.setAttribute('role', 'listitem');
    const link = el('div', 'pr');
    const repo = repoName(pr.repo || '');
    const title = String(pr.title || (pr.number ? '#' + pr.number : ''));
    link.append(line('title', title), line('repo', repo));
    const ref = pr.number ? `${repo} #${pr.number}` : repo;
    if (linkTo(link, pr.url)) link.setAttribute('aria-label', `${ref}: ${title}`);
    item.append(link);
    list.append(item);
  }
}

async function boot() {
  try {
    const r = await fetch(`/api/widget-config/${encodeURIComponent(id)}`);
    if (r.ok) {
      const wc = (await r.json())?.widgetConfig || {};
      user = String(wc.githubUser || '');
    }
  } catch {}
  poll({
    fetch: () => fetchData('data'),
    interval: TICK_MS,
    render: d => { state.ok(); render(d); },
    onError: ({ error, everOk, stale, since }) => {
      if (!everOk || stale) state.fail(error, { since, inert: everOk });
    },
  });
}

boot();
</script>
</body>
</html>
