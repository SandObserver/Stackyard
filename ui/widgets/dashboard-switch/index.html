<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Switch</title>
<script src="/js/widget-theme.js?v=9f9e1b99"></script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#1c1c1e;
    font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif;color:#FFFFFF}
  #root{width:100%;height:100%}
  svg{display:block;width:100%;height:100%}
  .nm{fill:#d6d6db;font-size:11px;font-weight:500;transition:fill .14s ease}
  .kc{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .kc:focus{outline:none}
  .kc .focus{opacity:0}
  .kc:focus-visible .focus{opacity:1}
  .kc:focus-visible .nm,.kc.cur .nm{fill:#fff;font-weight:700}
  /* Only the keychain moves forward on hover; the label stays put. */
  .chain{transition:transform .14s ease;transform-box:fill-box;transform-origin:50% 60%}
  .kc:focus-visible .chain,.kc.cur .chain{transform:scale(1.07)}
  .kc:focus-visible .chain{filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .key{transform-box:view-box}
  .kc.cur .key{
    animation-name:sway;animation-timing-function:cubic-bezier(.33,.68,.36,1);animation-fill-mode:both}
  @keyframes sway{0%{transform:rotate(0)}35%{transform:rotate(var(--amp))}70%{transform:rotate(calc(var(--amp) * -0.35))}100%{transform:rotate(0)}}
  @media (prefers-reduced-motion:reduce){.chain{transition:none}.key{animation:none!important}}
  .rail { fill:rgba(255,255,255,.07); stroke:rgba(255,255,255,.10) }
  html[data-theme="light"] .rail { fill:rgba(0,0,0,.07); stroke:rgba(0,0,0,.14) }
  html[data-theme="light"],html[data-theme="light"] body { background:#ffffff; color:#000000 }
  html[data-theme="light"] .nm { fill:#3a3a3c }
  html[data-theme="light"] .kc:focus-visible .nm,html[data-theme="light"] .kc.cur .nm { fill:#000000 }
  html[data-theme="light"] .kc:focus-visible .chain { filter:drop-shadow(0 3px 4px rgba(0,0,0,0.175)) }
  @media (hover:hover) and (pointer:fine){
    .kc:hover .nm{fill:#fff;font-weight:700}
    .kc:hover .chain{transform:scale(1.07);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
    .kc:hover .key{animation-name:sway;animation-timing-function:cubic-bezier(.33,.68,.36,1);animation-fill-mode:both}
    html[data-theme="light"] .kc:hover .nm { fill:#000000 }
    html[data-theme="light"] .kc:hover .chain { filter:drop-shadow(0 3px 4px rgba(0,0,0,0.175)) }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="widget.js?v=5cc4aab7"></script>
</body>
</html>
