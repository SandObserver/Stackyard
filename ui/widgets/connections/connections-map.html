<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connections — Map</title>
<script src="/js/widget-theme.js?v=9f9e1b99"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-user-select:none;user-select:none;}
  #c{display:block;width:100%;height:100%;}
  /* Keep left. The map does not mirror in Persian. */
  #key{position:absolute;left:13.4px;bottom:15.9px;display:flex;flex-direction:column;align-items:flex-start;gap:3.4px;
    font:600 13.6px/17px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;color:rgba(235,235,245,.6);
    text-shadow:1px 0 #1C1C1E,-1px 0 #1C1C1E,0 1px #1C1C1E,0 -1px #1C1C1E,1px 1px #1C1C1E,-1px -1px #1C1C1E,1px -1px #1C1C1E,-1px 1px #1C1C1E}
  html[data-theme="light"] #key{color:rgba(60,60,67,.72);
    text-shadow:1px 0 #FFFFFF,-1px 0 #FFFFFF,0 1px #FFFFFF,0 -1px #FFFFFF,1px 1px #FFFFFF,-1px -1px #FFFFFF,1px -1px #FFFFFF,-1px 1px #FFFFFF}
  #key[hidden]{display:none}
  .k{display:flex;align-items:center;gap:6.8px;white-space:nowrap;transition:opacity .12s}
  button.k{all:unset;display:flex;align-items:center;gap:6.8px;white-space:nowrap;cursor:pointer;transition:opacity .12s;
    -webkit-tap-highlight-color:transparent;position:relative}
  button.k::before{content:"";position:absolute;inset:-1.7px -8px -1.7px -13.4px}
  button.k:first-child::before{top:-14px}
  button.k:last-child::before{bottom:-15.9px}
  .k:focus-visible{outline:2px solid #0091FF;outline-offset:2px;border-radius:4px}
  .k.dim{opacity:.45}
  /* Keep the colour in forced colors. It is the only link to the map. */
  .k .dot{width:9px;height:9px;border-radius:50%;flex:none;forced-color-adjust:none}
  .k bdi{display:block;max-width:66px;overflow:hidden;text-overflow:ellipsis}
  .k.more{padding-inline-start:15.9px}
  .k.more.has-ring{padding-inline-start:0}
  .k .ring{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px currentColor}
  .k.has-why{align-items:flex-start}
  .k.has-why .dot{margin-top:4px}
  .k .col{display:flex;flex-direction:column;min-width:0}
  .k .sub{display:flex;align-items:center;gap:4px;max-width:132px;font-weight:500;font-size:11px;line-height:13.5px}
  .k .sub span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .why{width:10px;height:10px;flex:none}
  .why .sy-i{fill:currentColor}
  .why .sy-is{stroke:currentColor}
  .pop{position:fixed;inset:auto;margin:0;width:max-content;max-width:236px;
    display:flex;flex-direction:column;overflow:hidden;padding:9px 12px 10px 11px;border-radius:13px;
    border:.5px solid rgba(255,255,255,.1);background:#2C2C2E;color:#fff;box-shadow:0 8px 26px rgba(0,0,0,.5);
    font:500 12px/15px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;text-shadow:none;white-space:normal;text-align:start;
    -webkit-user-select:text;user-select:text;cursor:auto}
  /* Keep. The display above overrides the hidden state of a closed popover. */
  .pop:not(:popover-open){display:none}
  html[data-theme="light"] .pop{background:#FFFFFF;color:#000;border-color:rgba(0,0,0,.1);box-shadow:0 6px 24px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08)}
  .pop-in{min-height:0;margin:-3px -8px;padding:3px 8px;overflow:auto;overscroll-behavior:contain}
  .pop-in.fade{mask-image:linear-gradient(#000 calc(100% - 20px),transparent)}
  .pop-row+.pop-row{margin-top:8px;padding-top:8px;border-top:.5px solid rgba(255,255,255,.14)}
  html[data-theme="light"] .pop-row+.pop-row{border-top-color:rgba(0,0,0,.12)}
  .pop-h{display:flex;align-items:center;gap:6px;font-weight:600;font-size:11px;line-height:14px;color:#AEAEB2}
  .pop-h bdi{min-width:0;overflow-wrap:anywhere}
  .pop .dot{width:7px;height:7px;border-radius:50%;flex:none;forced-color-adjust:none}
  .pop-kind{margin-top:3px;font-weight:600;font-size:13.6px;line-height:17px;letter-spacing:-.01em}
  .pop-msg{margin-top:2px;color:#AEAEB2;overflow-wrap:anywhere}
  .pop[dir="rtl"] .pop-msg{text-align:end}
  html[data-theme="light"] .pop-h,html[data-theme="light"] .pop-msg{color:#636366}
  .pop-act{all:unset;position:relative;display:block;width:fit-content;margin:1px -8px -5px;padding:5px 8px;border-radius:4px;
    font-weight:600;font-size:12px;line-height:15px;color:#409CFF;cursor:pointer}
  .pop-act::first-letter{text-transform:uppercase}
  html[data-theme="light"] .pop-act{color:#0066CC}
  .pop-in:focus-visible,.pop-act:focus-visible{outline:2px solid #0091FF;outline-offset:2px}
  @media (forced-colors:active){.pop{border:1px solid CanvasText}}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #map-link{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
  #map-link:focus-visible{outline:2px solid #0091FF;outline-offset:-3px}
  #tt{backdrop-filter:blur(18px) saturate(160%)}
  html[data-transparency="reduce"] #tt{backdrop-filter:none}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="World map of connections"></canvas>
<div id="map-link"></div>
<div id="key" dir="ltr" hidden></div>
<p class="sr-only" id="sr"></p>
<script type="module" src="connections-map.js?v=8269f9a9"></script>
</body>
</html>
