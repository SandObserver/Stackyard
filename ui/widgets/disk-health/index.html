<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disk Health</title>
<script src="/js/widget-theme.js?v=645f280f"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#2C2C2E;
    font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }

  #root { width:100%; height:100%; position:relative; }

  #shell {
    width:100%; height:100%;
    padding:7px; padding-inline-end:0;
  }
  #panel {
    width:100%; height:100%;
    border-radius:15px;
    background:#2C2C2E;
    padding:11px; padding-inline-end:0;
    display:flex; gap:8px;
    position:relative;
  }

  #left { flex:1; display:flex; flex-direction:column; min-width:0; }

  #bays {
    flex:1; min-height:0;
    display:flex;
    border-radius:10px; padding:1.5px;
    background:#1C1C1E;
    box-shadow:0 0 0 2px #1C1C1E;
  }
  #root.size-medium #bays { padding:2px; }

  .bay {
    flex:1 1 0; min-width:0;
    border:1.5px solid transparent;
    background-clip:padding-box;
    border-radius:8.5px;
    position:relative;
    overflow:hidden;
    background-color:#3A3A3C;
    cursor:default;
    display:flex;
    transform-origin:center;
    transition: transform 0.2s cubic-bezier(.34,1.2,.64,1), box-shadow 0.2s ease, background-color 0.2s ease;
  }
  .bay.empty { background-color:#2C2C2E; }
  .bay.unread { background-color:#2C2C2E; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.22); }
  .bay.unread .bay-name { color:rgba(255,255,255,0.28); }
  .bay.assigned { cursor:pointer; }
  #root.size-medium .bay { border-width:1px; border-radius:8px; }
  .bay.assigned:hover,
  .bay.assigned.touch-active {
    will-change:transform;
    transform: scale(1.08);
    background-color:#48484A;
    z-index:3;
    box-shadow: 0 6px 16px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
  }

  .bay-name {
    flex:1; min-height:0;
    display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl;
    font-size:11px; font-weight:500; letter-spacing:0.08em;
    color:rgba(255,255,255,0.34);
    white-space:nowrap; overflow:hidden; pointer-events:none;
  }
  .led {
    position:absolute; top:6px; inset-inline:0; margin-inline:auto;
    width:6px; height:6px; border-radius:50%;
    background:rgba(0,0,0,0.42); pointer-events:none;
  }
  .bay.empty .led { display:none; }
  .led.green { background:#30D158; } .led.red { background:#FF4245; }
  .led.unread { background:transparent; box-shadow: inset 0 0 0 1.5px #8E8E93; }

  #nums { height:16px; flex-shrink:0; display:flex; align-items:center; padding:3px 4px 0; }
  #nums span { flex:1; text-align:center; font-size:11px; font-weight:500; color:rgba(255,255,255,0.4); }
  #alert { display:flex; align-items:center; gap:5px; padding:5px 2px 0; font-size:11px; font-weight:600;
    line-height:1.2; color:rgba(255,255,255,0.92); }
  #alert::before { content:''; width:6px; height:6px; border-radius:50%; flex-shrink:0; background:#FF4245; }
  #alert[hidden], #nums[hidden] { display:none; }

  #right {
    width:34px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; gap:6px; padding-top:1px;
    border-inline-start:1px solid rgba(0,0,0,0.55);
  }
  #pwrbtn {
    width:14px; height:14px; border-radius:50%;
    background:#2C2C2E;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    flex-shrink:0;
  }
  #usb {
    width:8px; height:13px; border-radius:2.5px;
    background:#1C1C1E; position:relative; flex-shrink:0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  #usb::before {
    content:''; position:absolute; top:2px; bottom:2px; left:2px;
    width:2.5px; border-radius:2px; background:#0091FF;
  }
  #sysled {
    margin-top:auto; margin-bottom:2px; flex-shrink:0;
    width:4.5px; height:4.5px; border-radius:50%; background:#3A3A3C;
  }
  #sysled.green { background:#30D158; }

  #tip {
    position:absolute; z-index:20;
    background:rgba(20,20,22,0.96);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-radius:8px; padding:7px 10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.55), inset 0 0 0 0.5px rgba(255,255,255,0.1);
    display:flex; flex-direction:column; gap:3px;
    pointer-events:none;
    opacity:0; transform:translateY(2px);
    transition: opacity 0.13s ease, transform 0.13s ease;
  }
  #root.tip-active #tip { opacity:1; transform:translateY(0); }
  #tip .t1 { display:flex; align-items:center; gap:6px; }
  #tip .t1 i { width:7px; height:7px; border-radius:50%; flex-shrink:0; background:#3A3A3C; }
  #tip .t1 i.green { background:#30D158; } #tip .t1 i.red { background:#FF4245; }
  #tip .t1 i.unread { background:transparent; box-shadow: inset 0 0 0 1.5px #8E8E93; }
  #tip .nm { font-size:12px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #tip .meta { font-size:11px; font-weight:500; color:rgba(255,255,255,0.62); white-space:nowrap; padding-inline-start:13px; }

  @media (prefers-reduced-motion: reduce){
    .bay,#tip{transition:none !important}
  }
</style>
</head>
<body>
<div id="root" class="size-small" role="group" aria-label="Disk health">
  <div id="shell"><div id="panel">
    <div id="left">
      <div id="bays"></div>
      <div id="nums"></div>
      <div id="alert" hidden></div>
    </div>
    <div id="right">
      <div id="pwrbtn" aria-hidden="true">
        <svg width="8" height="8" viewBox="0 0 12 12" fill="none">
          <path d="M6 1v3.2" stroke="rgba(255,255,255,0.6)" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M3.8 2.9A4.3 4.3 0 1 0 8.2 2.9" stroke="rgba(255,255,255,0.6)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div id="usb" aria-hidden="true"></div>
      <i id="sysled" aria-hidden="true"></i>
    </div>
  </div></div>
  <div id="tip" role="status" aria-live="polite">
    <div class="t1"><i id="tip-led"></i><span class="nm" id="tip-name"></span></div>
    <div class="meta" id="tip-meta"></div>
  </div>
</div>

<script type="module">
import { poll, fetchData, openUrl, loadStrings, wt, wtCount, formatNumber, formatList, errorState, cssZoom } from '/js/widget-toolbox.js?v=43644d20';
await loadStrings();
document.getElementById('root').setAttribute('aria-label', wt('ui.diskHealth','Disk health'));
const params    = new URLSearchParams(location.search);
const size      = params.get('size') || 'small';
const BAY_COUNT = size === 'medium' ? 10 : 4;
const isMobile  = params.get('mobile') === '1';

const rootEl = document.getElementById('root');
rootEl.classList.remove('size-small','size-medium');
rootEl.classList.add(size === 'medium' ? 'size-medium' : 'size-small');

if (isMobile) {
  const s = document.createElement('style');
  s.textContent = `#panel { padding:9px; padding-inline-end:0; }`;
  document.head.appendChild(s);
}

/* A bay the service did not report. Its status fields are placeholders.
   Reading them draws a missing drive as healthy. */
const unread = d => !!(d && d.error);

function ledClass(s, hasSmart) {
  if (!hasSmart) return '';
  return s === 0 ? 'green' : 'red';
}
function statusText(s, hasSmart) {
  if (!hasSmart) return wt('ui.noSmart','No SMART data');
  return s === 0 ? wt('ui.healthy','Healthy') : wt('ui.failed','Failed');
}
/* TB and GB are symbols, not words: only the figure is localised. */
function fmtCap(c){ if(!c||c<=0) return ''; if(c>=1e12){const t=c/1e12; return formatNumber(t>=10?Math.round(t):Number(t.toFixed(1)))+' TB';} return formatNumber(Math.round(c/1e9))+' GB'; }
function shortName(d) {
  const n = (d.device_name || '').replace(/^\/dev\//, '');
  return n ? n.toUpperCase() : (d.device?.label || d.label || '');
}
function fullName(d) { return d.model_name || d.device?.label || shortName(d); }
function deviceHref(d) {
  if (!_href) return '';
  if (_provider !== 'scrutiny') return _href;
  if (!d || !d.device_id) return _href;
  return _href.replace(/\/+$/, '') + '/web/device/' + encodeURIComponent(d.device_id);
}

let bayData   = new Array(BAY_COUNT).fill(null);
let _href     = '';
let _provider = 'scrutiny';
let bayEls    = [];
let activeBay = -1;

const tipEl   = document.getElementById('tip');
const tipLed  = document.getElementById('tip-led');
const tipName = document.getElementById('tip-name');
const tipMeta = document.getElementById('tip-meta');

function showTip(i) {
  const d = bayData[i];
  if (!d) return;
  if (unread(d)) {
    tipLed.className = 'unread';
    tipName.textContent = fullName(d) || wt('ui.bay', 'Bay {n}').replace('{n}', formatNumber(i + 1));
    tipMeta.textContent = wt('ui.notReporting', 'Not reporting');
    rootEl.classList.add('tip-active');
    positionTip(i);
    return;
  }
  const lc = ledClass(d.device_status ?? 0, d.hasSmart ?? false);
  tipLed.className = lc || '';
  tipName.textContent = fullName(d);
  const parts = [];
  const cap = fmtCap(d.capacity);
  if (cap) parts.push(cap);
  parts.push(statusText(d.device_status ?? 0, d.hasSmart ?? false));
  if (d.temp != null) parts.push(formatNumber(Number(d.temp)) + '°C');
  tipMeta.textContent = parts.filter(Boolean).join(' · ');
  rootEl.classList.add('tip-active');
  positionTip(i);
}
function hideTip() { rootEl.classList.remove('tip-active'); }

function positionTip(i) {
  const bay = bayEls[i];
  const z = cssZoom();
  const unzoom = r => ({ left:r.left/z, top:r.top/z, width:r.width/z, height:r.height/z, bottom:r.bottom/z });
  const rootRect = unzoom(rootEl.getBoundingClientRect());
  const bayRect  = unzoom(bay.getBoundingClientRect());
  tipEl.style.left = '0px'; tipEl.style.top = '0px';
  tipEl.style.maxWidth = (rootRect.width - 8) + 'px';
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  const bayCx = (bayRect.left - rootRect.left) + bayRect.width / 2;
  let left = bayCx - tw / 2;
  left = Math.max(4, Math.min(left, rootRect.width - tw - 4));
  let top = (bayRect.top - rootRect.top) - th - 6;
  if (top < 4) top = (bayRect.bottom - rootRect.top) + 6;
  if (top + th > rootRect.height - 4) top = rootRect.height - th - 8;
  top = Math.max(4, top);
  tipEl.style.left = Math.round(left) + 'px';
  tipEl.style.top  = Math.round(top) + 'px';
}

function build() {
  const baysEl = document.getElementById('bays');
  const numsEl = document.getElementById('nums');
  baysEl.innerHTML = ''; numsEl.innerHTML = '';
  bayEls = [];
  for (let i = 0; i < BAY_COUNT; i++) {
    const bay = document.createElement('div');
    bay.className = 'bay';
    bay.innerHTML = `<div class="bay-name" id="nm-${i}"></div><i class="led" id="led-${i}"></i>`;
    baysEl.appendChild(bay);
    bayEls.push(bay);

    const num = document.createElement('span');
    num.textContent = formatNumber(i + 1);
    numsEl.appendChild(num);

    addEvents(bay, i);
  }
}

function update() {
  for (let i = 0; i < BAY_COUNT; i++) {
    const d   = bayData[i];
    const bay = bayEls[i];
    const nm  = document.getElementById(`nm-${i}`);
    const led = document.getElementById(`led-${i}`);
    if (unread(d)) {
      bay.classList.add('unread'); bay.classList.remove('empty', 'assigned');
      led.className = 'led unread';
      nm.textContent = shortName(d);
      bay.setAttribute('role', 'img'); bay.removeAttribute('tabindex');
      bay.setAttribute('aria-label',
        `${wt('ui.bay','Bay {n}').replace('{n}', formatNumber(i + 1))}: ${wt('ui.notReporting','Not reporting')}`);
    } else if (d) {
      bay.classList.add('assigned'); bay.classList.remove('empty', 'unread');
      const lc = ledClass(d.device_status ?? 0, d.hasSmart ?? false);
      led.className = lc ? 'led ' + lc : 'led';
      nm.textContent = shortName(d);
      const cap = fmtCap(d.capacity);
      const st  = statusText(d.device_status ?? 0, d.hasSmart ?? false);
      bay.setAttribute('role','button'); bay.setAttribute('tabindex','0');
      bay.setAttribute('aria-label', `${wt('ui.bay','Bay {n}').replace('{n}', formatNumber(i + 1))}: ${shortName(d)}${cap ? ', '+cap : ''}${st ? ', '+st : ''}`);
    } else {
      bay.classList.add('empty'); bay.classList.remove('assigned', 'unread');
      led.className = 'led';
      nm.textContent = '';
      bay.setAttribute('role','img'); bay.removeAttribute('tabindex');
      bay.setAttribute('aria-label', wt('ui.bayEmpty','Bay {n}: empty').replace('{n}', formatNumber(i + 1)));
    }
  }
  updateAlert();
}

/* Names failed bays in words, so a failure does not rest on the LED colour. */
function updateAlert() {
  const failed = [];
  bayData.forEach((d, i) => {
    if (d && !unread(d) && ledClass(d.device_status ?? 0, d.hasSmart ?? false) === 'red') failed.push(formatNumber(i + 1));
  });
  const alertEl = document.getElementById('alert');
  alertEl.hidden = !failed.length;
  document.getElementById('nums').hidden = failed.length > 0;
  alertEl.textContent = wtCount('ui.baysFailed', failed.length, { one: 'Bay {list} failed', other: 'Bays {list} failed' }, { list: formatList(failed) });
}

function openBay(i) {
  const d = bayData[i]; if (!d || unread(d)) return;
  const u = deviceHref(d); if (u) openUrl(u);
}

function addEvents(bay, i) {
  const touch = () => 'ontouchstart' in window;
  bay.addEventListener('mouseenter', () => { if (!touch() && bayData[i]) showTip(i); });
  bay.addEventListener('mouseleave', () => { if (!touch()) hideTip(); });
  bay.addEventListener('click',      () => { if (!touch()) openBay(i); });
  bay.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && bayData[i]) { e.preventDefault(); openBay(i); } });
  bay.addEventListener('focus', () => { if (bayData[i]) showTip(i); });
  bay.addEventListener('blur',  () => hideTip());
  let bsx=0, bsy=0, bmoved=false;
  bay.addEventListener('touchstart', e => { const t=e.touches[0]; if(t){ bsx=t.clientX; bsy=t.clientY; bmoved=false; } }, { passive:true });
  bay.addEventListener('touchmove',  e => { const t=e.touches[0]; if(t && (Math.abs(t.clientX-bsx)>8 || Math.abs(t.clientY-bsy)>8)) bmoved=true; }, { passive:true });
  bay.addEventListener('touchend', e => {
    if (bmoved) return;
    e.preventDefault();
    if (!bayData[i]) return;
    if (i === activeBay) {
      bay.classList.remove('touch-active'); activeBay = -1; hideTip();
      openBay(i);
    } else {
      bayEls.forEach((b,j) => { if (j!==i) b.classList.remove('touch-active'); });
      bay.classList.add('touch-active'); activeBay = i; showTip(i);
      /* Addressed to our own origin, not '*': the parent is always the dashboard. */
      try { parent.postMessage({ type:'widget-active' }, window.location.origin); } catch (_) {}
    }
  });
}

document.addEventListener('touchend', e => {
  if (!e.target.closest('.bay')) {
    bayEls.forEach(b => b.classList.remove('touch-active'));
    activeBay = -1; hideTip();
  }
}, { passive:true });

/* The dashboard calls this directly when a tap lands outside this widget. */
window.__clearActive = () => { bayEls.forEach(b => b.classList.remove('touch-active')); activeBay = -1; hideTip(); };

function applyBays(d) {
  _href   = d.href || '';
  _provider = d.provider || 'scrutiny';
  bayData = d.bays.map(b => b || null);
  while (bayData.length < BAY_COUNT) bayData.push(null);
  bayData = bayData.slice(0, BAY_COUNT);
  update();
}

build();
update();

const sysLed = document.getElementById('sysled');
const state = errorState({
  root: document.getElementById('root'),
  content: document.getElementById('shell'),
  place: 'center',
});

poll({
  fetch: () => fetchData('disk-health'),
  interval: 60_000,
  render: d => { state.ok(); sysLed.classList.add('green'); applyBays(d); },
  isEmpty: d => !d || !Array.isArray(d.bays) || d.bays.length === 0,
  onEmpty: () => state.empty(wt('ui.noDrives', 'No drives reported')),
  onError: ({ error, everOk, stale, since }) => {
    if (!everOk || stale) { sysLed.classList.remove('green'); state.fail(error, { since, inert: everOk }); }
  },
});
</script>
</body>
</html>
