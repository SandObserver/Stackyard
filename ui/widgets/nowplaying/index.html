<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now Playing</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif}

  .widget{width:100%;height:100%;position:relative;border-radius:inherit;overflow:hidden;
    background:linear-gradient(160deg,#3A3A3C,#2C2C2E 60%,#2C2C2E)}
  .widget.clickable{cursor:pointer}
  .widget.clickable:focus-visible{outline:2px solid #00D2E0;outline-offset:-3px}
  .widget::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(0,0,0,.3)}

  .stage{position:absolute;inset:0}

  .sticker{position:absolute;left:14px;right:14px;top:14px;height:73px;
    background:linear-gradient(180deg,#FFFFFF,#d2d2d2);border-radius:14px;
    border:1px solid rgba(0,0,0,.18);box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6);
    padding:8px 12px 22px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .title{font-size:13px;font-weight:700;line-height:1.16;color:#1C1C1E;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sub{flex:none;font-size:9px;font-weight:600;line-height:1.12;letter-spacing:.02em;color:#48484A;margin-top:auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .idle .title{color:#636366;font-weight:600}
  .sticker{--wt-cap-color:#1C1C1E}
  .np-cap{flex:none;flex-wrap:wrap;row-gap:3px}
  .sticker .np-cap b{font-size:12.5px;font-weight:600;line-height:1.2}
  .sticker .np-cap svg{width:14px;height:14px}
  .sticker .np-cap i{flex-basis:100%;padding-inline-start:19px;font-size:9px;font-weight:600;
    letter-spacing:.03em;text-transform:uppercase;color:#8E8E93}
  /* .title sets display. Without this rule the hidden attribute does nothing. */
  .sticker [hidden],.band [hidden]{display:none}

  .band{position:absolute;left:14px;right:14px;top:68px;height:19px;z-index:3;
    display:flex;align-items:center;justify-content:space-between;gap:4px;padding-inline:12px 4px;
    border-radius:0 0 14px 14px;box-shadow:inset 0 .5px 0 rgba(0,0,0,.2);
    background:var(--band,#8E8E93);color:var(--band-ink,#FFFFFF)}
  .err .band{background:#636366;color:#FFFFFF}
  .player{min-width:0;font-size:8.5px;font-weight:700;line-height:1;letter-spacing:.06em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .ctl{flex:none;display:flex;align-items:center}
  .count{min-width:14px;font-size:8.5px;font-weight:600;line-height:1;text-align:center;opacity:.8;
    font-variant-numeric:tabular-nums}

  .window{position:absolute;left:14px;right:14px;top:94px;bottom:14px;
    background:radial-gradient(135% 135% at 50% 20%,#636366,#48484A 58%,#48484A);
    border-radius:5px 5px 38px 38px;overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.28)}

  .tape{position:absolute;left:71px;top:-8px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 46%,#1C1C1E,#1C1C1E 80%);transition:width .6s ease,height .6s ease}
  .strand{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .spinwrap{position:absolute;left:71px;top:-8px;width:88px;height:88px;margin:-44px 0 0 -44px;color:#8E8E93}
  .spinwrap .reel{width:100%;height:100%;display:block;transform-origin:center;
    animation:spin 3.6s linear infinite;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  .spinwrap.paused .reel{animation-play-state:paused}
  @keyframes spin{to{transform:rotate(360deg)}}

  .glass{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ticks{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:6px;opacity:.5}
  .ticks i{display:block;width:12px;height:2px;background:#FFFFFF;border-radius:1px}

  .nav{width:19px;height:19px;border:0;border-radius:6px;background:transparent;color:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .nav svg{width:10px;height:10px}
  .nav:hover{background:rgba(128,128,128,.22)}
  .nav:focus-visible{outline:2px solid currentColor;outline-offset:-2px}
  /* A chevron is a drawing: no logical property points it the other way. */
  [dir="rtl"] .nav svg{transform:scaleX(-1)}

  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}

  @media(prefers-reduced-motion:reduce){
    .spinwrap .reel{animation:none!important}
    .tape{transition:none!important}
  }
</style>
</head>
<body>
<div class="widget idle" id="w" role="group" aria-label="Now Playing">
  <div class="stage">
    <div class="sticker" id="sticker">
      <div class="title" id="title">Nothing playing</div>
      <div class="sub" id="sub"></div>
      <div class="np-cap" id="np-cap" hidden></div>
    </div>
    <div class="band">
      <div class="player" id="player"></div>
      <div class="ctl" id="ctl" hidden>
        <button class="nav" id="prev" type="button" aria-label="Previous item">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.4 5.4 9 12l6.4 6.6-1.6 1.6L5.8 12l8-8.2z"/></svg>
        </button>
        <span class="count" id="count" aria-hidden="true"></span>
        <button class="nav" id="next" type="button" aria-label="Next item">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.6 5.4 15 12l-6.4 6.6 1.6 1.6 8-8.2-8-8.2z"/></svg>
        </button>
      </div>
    </div>
    <div class="window">
      <!-- Strand first. The tape spool paints over its left end, so the join
           stays hidden at every wound diameter. -->
      <svg class="strand" viewBox="0 0 142 56" preserveAspectRatio="none" aria-hidden="true">
        <path id="strandpath" d="M142 19 L74 30 L74 36 L142 25 Z" fill="#1C1C1E"/>
      </svg>
      <div class="tape" id="tape"></div>
      <div class="spinwrap paused" id="spin">
        <svg class="reel" id="reel" viewBox="792.54 31.97 196.00 196.00" aria-hidden="true">
          <path d=" M 846.60 73.75 C 854.03 68.08 862.02 62.68 871.03 59.93 C 874.09 61.75 874.96 65.71 876.95 68.50 C 892.30 65.15 908.90 67.45 922.50 75.43 C 937.55 84.03 948.62 99.11 952.49 116.00 C 955.24 116.03 958.01 115.80 960.75 116.23 C 962.00 117.17 961.96 118.87 962.22 120.27 C 963.09 128.08 963.35 136.01 962.34 143.82 C 962.05 145.18 962.11 146.88 960.82 147.75 C 957.72 148.25 954.56 147.94 951.45 148.00 C 948.55 157.32 943.64 166.03 936.92 173.13 C 934.33 175.85 931.53 178.37 928.55 180.66 C 920.28 186.68 910.62 190.77 900.51 192.31 C 896.71 192.85 892.86 193.06 889.04 192.98 C 879.06 192.71 869.26 189.91 860.49 185.20 C 858.09 187.02 856.43 190.79 853.17 190.93 C 845.90 186.06 839.57 179.78 834.09 172.98 C 833.23 171.59 831.37 170.15 832.25 168.34 C 833.67 166.36 835.55 164.76 837.25 163.02 C 830.03 151.08 826.76 136.78 828.39 122.90 C 830.00 107.77 837.50 93.53 848.67 83.26 C 847.60 80.37 842.78 76.39 846.60 73.75 M 881.51 78.71 C 871.25 80.65 861.64 85.89 854.17 93.16 C 844.71 102.91 838.56 116.27 839.00 130.00 C 838.56 143.26 844.32 156.18 853.20 165.82 C 860.20 173.20 869.44 178.33 879.26 180.88 C 890.56 182.97 902.80 182.48 913.15 177.04 C 927.73 170.49 938.35 156.61 942.00 141.18 C 943.32 133.86 943.33 126.31 942.03 118.99 C 938.39 103.26 927.46 89.17 912.54 82.67 C 903.03 77.76 891.93 77.25 881.51 78.71 Z" fill="#FFFFFF"/>
          <path d=" M 882.57 83.76 C 893.71 81.75 905.58 83.83 915.25 89.75 C 927.33 96.96 935.83 109.85 937.59 123.81 C 939.03 134.51 936.65 145.68 930.91 154.83 C 923.43 166.90 910.26 175.30 896.11 176.72 C 883.13 178.20 869.63 173.95 859.91 165.21 C 848.02 154.96 842.06 138.44 844.53 122.96 C 847.21 103.57 863.25 87.00 882.57 83.76 Z" fill="#FFFFFF"/>
          <path d=" M 928.55 180.66 C 931.53 178.37 934.33 175.85 936.92 173.13 C 941.69 177.90 945.38 183.59 949.66 188.79 C 951.57 191.20 953.50 193.63 955.01 196.34 C 955.18 198.10 954.89 200.15 953.27 201.18 C 938.14 212.82 920.17 221.31 901.10 223.60 C 898.01 223.83 894.19 224.86 891.98 221.99 C 891.00 219.11 890.72 216.06 890.49 213.05 C 890.07 206.35 889.16 199.69 889.04 192.98 C 892.86 193.06 896.71 192.85 900.51 192.31 C 901.86 195.99 902.85 199.85 904.75 203.29 C 905.08 203.49 905.73 203.89 906.06 204.08 C 915.44 202.77 924.32 198.89 932.63 194.46 C 935.61 193.27 933.57 189.96 932.97 187.86 C 931.74 185.36 931.56 181.65 928.55 180.66 Z" fill="currentColor" transform="translate(890.54 129.97) scale(0.86) translate(-890.54 -129.97)"/>
        </svg>
      </div>
      <svg class="glass" viewBox="0 0 142 56" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.17"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/></linearGradient></defs>
        <path transform="translate(-177,-27.8) scale(0.415)" d=" M 577.29 67.02 C 609.06 66.98 640.82 67.00 672.59 67.01 C 683.76 98.92 695.07 130.78 706.19 162.71 C 709.02 170.59 704.38 179.96 696.51 182.67 C 678.35 189.17 660.14 195.56 641.96 202.01 C 635.92 204.29 628.64 202.47 624.43 197.58 C 620.94 193.44 620.07 187.90 618.08 183.00 C 611.55 183.02 605.01 182.95 598.48 183.06 C 598.32 182.00 597.54 180.65 598.97 180.13 C 604.97 179.76 611.01 180.12 617.03 179.99 C 614.45 172.66 611.86 165.33 609.30 157.99 C 612.48 157.99 615.66 157.94 618.84 157.84 C 618.84 157.17 618.83 155.84 618.82 155.17 C 615.35 155.04 611.88 154.98 608.42 154.95 C 608.52 155.71 608.72 157.23 608.82 157.98 C 605.52 157.96 602.20 158.20 598.92 157.88 C 597.58 157.29 598.30 155.94 598.51 154.91 C 601.75 155.01 604.99 155.00 608.24 154.99 C 597.93 125.67 587.62 96.34 577.29 67.02 Z" fill="url(#g)"/>
      </svg>
      <div class="ticks" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>
  <span class="sr" id="sr" aria-live="polite"></span>
</div>
<script type="module">
import { poll, fetchData, openUrl, loadStrings, wt, errorState, localiseDigits } from '/js/widget-toolbox.js?v=01f4c217';
await loadStrings();
document.getElementById('title').textContent = wt('ui.nothingPlaying', 'Nothing playing');
document.getElementById('w').setAttribute('aria-label', wt('widget.label', 'Now Playing'));
document.getElementById('prev').setAttribute('aria-label', wt('ui.previous', 'Previous item'));
document.getElementById('next').setAttribute('aria-label', wt('ui.next', 'Next item'));
  const API='/api';
  const id=new URLSearchParams(location.search).get('id')||'';
  const TICK_MS=10000;
  const COLORS={plex:'#e5a00d',jellyfin:'#007ca6',emby:'#4caf50',navidrome:'#0091FF'};
  const PROVIDER_NAME={plex:'Plex',jellyfin:'Jellyfin',emby:'Emby',navidrome:'Navidrome'};
  /* White on Plex, Emby and Navidrome is below 4.5:1. */
  const INK={plex:'#1C1C1E',jellyfin:'#FFFFFF',emby:'#1C1C1E',navidrome:'#1C1C1E'};
  const TAPE_MIN=64, TAPE_MAX=126, TAPE_NOPROG=92;
  const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;

  const wEl=document.getElementById('w');
  const titleEl=document.getElementById('title'), subEl=document.getElementById('sub'), playerEl=document.getElementById('player');
  const tapeEl=document.getElementById('tape'), spinEl=document.getElementById('spin'), reelEl=document.getElementById('reel');
  const prevB=document.getElementById('prev'), nextB=document.getElementById('next'), srEl=document.getElementById('sr');
  const ctlEl=document.getElementById('ctl'), countEl=document.getElementById('count');
  const strandEl=document.getElementById('strandpath');

  let sessions=[], provider='', idx=0, href='';

  function tapeSize(s){
    if(!s) return TAPE_MIN;
    if(s.progress==null) return TAPE_NOPROG;
    return TAPE_MIN+(TAPE_MAX-TAPE_MIN)*Math.min(1,Math.max(0,s.progress));
  }
  function describe(s){
    if(!s) return wt('ui.nothingPlaying','Nothing playing');
    let t=wt('ui.nowPlayingPrefix','Now playing:')+' '+(s.title||'');
    if(s.subtitle) t+=', '+s.subtitle;
    if(s.player) t+=' '+wt('ui.onPlayer','on')+' '+s.player;
    if(PROVIDER_NAME[provider]) t+=' — '+PROVIDER_NAME[provider];
    if(s.state==='paused') t+=' ('+wt('ui.paused','paused')+')';
    return t;
  }
  function showText(on){
    for(const el of [titleEl,subEl]) el.hidden=!on;
  }

  function paint(announce){
    const s=sessions[idx];
    const tint=COLORS[provider]||'#8E8E93';
    reelEl.parentElement.style.color=tint;
    wEl.style.setProperty('--band',tint);
    wEl.style.setProperty('--band-ink',INK[provider]||'#FFFFFF');
    const d = s ? tapeSize(s) : TAPE_MIN;
    if(!s){
      wEl.classList.add('idle');
      titleEl.textContent=wt('ui.nothingPlaying','Nothing playing'); subEl.textContent='';
      playerEl.textContent=PROVIDER_NAME[provider]||'';
      spinEl.classList.add('paused');
    }else{
      wEl.classList.remove('idle');
      titleEl.textContent=s.title||''; subEl.textContent=s.subtitle||'';
      playerEl.textContent=s.player||PROVIDER_NAME[provider]||'';
      spinEl.classList.toggle('paused', s.state==='paused');
    }
    tapeEl.style.width=d+'px'; tapeEl.style.height=d+'px';
    /* The offset seats the strand's full 6px thickness inside the spool. Its
       lower edge otherwise shows as a detached stub. */
    let ly=-8+d/2-6; if(ly>50)ly=50; if(ly<18)ly=18;
    strandEl.setAttribute('d', `M142 19 L74 ${(ly-3).toFixed(1)} L74 ${(ly+3).toFixed(1)} L142 25 Z`);
    const label=describe(s);
    wEl.setAttribute('aria-label', href? label+'. '+wt('ui.activateToOpen','Activate to open link.') : label);
    if(announce) srEl.textContent=label;
    const many=sessions.length>1;
    ctlEl.hidden=!many;
    countEl.textContent=many ? localiseDigits(`${idx+1}/${sessions.length}`) : '';
  }
  const EASE_OUT='cubic-bezier(.4,0,1,1)', EASE_IN='cubic-bezier(.32,.72,0,1)';
  let swapping=false;
  function nav(dir){
    if(sessions.length<2||swapping) return;
    idx=(idx+dir+sessions.length)%sessions.length;
    if(reduced){ paint(true); return; }
    swapping=true;
    const shift=6*dir*(getComputedStyle(wEl).direction==='rtl'?-1:1);
    const els=[titleEl,subEl,playerEl,countEl];
    const outs=els.map(el=>el.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-shift}px)`}],
      {duration:160,easing:EASE_OUT,fill:'forwards'}));
    Promise.all(outs.map(a=>a.finished)).then(()=>{
      paint(true);
      const ins=els.map(el=>el.animate([{opacity:0,transform:`translateX(${shift}px)`},{opacity:1,transform:'none'}],
        {duration:200,easing:EASE_IN}));
      for(const a of outs) a.cancel();
      return Promise.all(ins.map(a=>a.finished));
    }).catch(()=>{}).finally(()=>{ swapping=false; });
  }
  prevB.addEventListener('click',e=>{e.stopPropagation();nav(-1);});
  nextB.addEventListener('click',e=>{e.stopPropagation();nav(1);});

  function openHref(){ if(href) openUrl(href); }

  async function npFetch(){
    return fetchData();
  }
  function apply(d){
    provider=d.provider||provider;
    const next=Array.isArray(d.sessions)?d.sessions:[];
    const changed=JSON.stringify(next)!==JSON.stringify(sessions);
    sessions=next;
    if(idx>=sessions.length) idx=0;
    paint(changed);
  }
  async function boot(){
    try{
      const r=await fetch(`${API}/widget-config/${encodeURIComponent(id)}`);
      if(r.ok){ const c=await r.json(); href=(c&&c.widgetConfig&&c.widgetConfig.href)||''; }
    }catch(e){}
    if(href){
      wEl.classList.add('clickable');
      wEl.setAttribute('role','link');
      wEl.setAttribute('tabindex','0');
      wEl.addEventListener('click',openHref);
      wEl.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openHref(); } });
    }
    const state=errorState({ root:wEl, content:[document.querySelector('.window')],
      caption:document.getElementById('np-cap') });

    poll({ fetch:npFetch, interval:TICK_MS,
      render:d=>{ wEl.classList.remove('err'); showText(true); document.getElementById('np-cap').removeAttribute('aria-hidden'); state.ok(); apply(d); },
      onError:({error,everOk,stale,since})=>{
        if(!everOk||stale){
          sessions=[]; idx=0; paint(false);
          wEl.classList.add('err');
          showText(false);
          const line=state.fail(error,{since,inert:everOk});
          wEl.setAttribute('aria-label', line);
          document.getElementById('np-cap').setAttribute('aria-hidden','true');
        }
      } });
  }
  boot();
</script>
</body>
</html>
