<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now Playing</title>
<script src="/js/widget-theme.js?v=2551d2fb"></script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif}
  html{-webkit-tap-highlight-color:transparent}
  .widget{width:100%;height:100%;position:relative;border-radius:inherit;overflow:hidden;contain:strict;
    background:#2C2C2E}
  .np-link{position:absolute;inset:0;z-index:2;border-radius:inherit}
  .np-link.clickable{cursor:pointer}
  .np-link.clickable:focus-visible{outline:2px solid #00D2E0;outline-offset:-3px}

  .sticker{position:absolute;left:14px;top:14px;width:142px;height:78px;
    background:linear-gradient(180deg,#FFFFFF,#d2d2d2);border-radius:14px;
    border:1px solid rgba(0,0,0,.18);box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6);
    padding:8px 12px 22px;display:flex;flex-direction:column;overflow:hidden;
    --wt-cap-color:#1C1C1E;--wt-ph:rgba(60,60,67,0.14)}
  .lbl{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
  .title{font-size:13px;font-weight:700;line-height:1.16;color:#1C1C1E;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sub{flex:none;font-size:11px;font-weight:600;line-height:1.12;letter-spacing:.02em;color:#48484A;margin-top:auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .idle .title{color:#636366;font-weight:600}
  .np-cap{flex:none;flex-wrap:wrap;row-gap:3px}
  .sticker .np-cap b{font-size:12.5px;font-weight:600;line-height:1.2}
  .sticker .np-cap svg{width:14px;height:14px}
  .sticker .np-cap i{flex-basis:100%;padding-inline-start:19px;font-size:11px;font-weight:600;
    letter-spacing:.03em;text-transform:uppercase;color:#545458}
  /* .title sets display. Without this rule the hidden attribute does nothing. */
  .sticker [hidden],.band [hidden]{display:none}

  .band{position:absolute;left:14px;top:73px;width:142px;height:19px;z-index:3;pointer-events:none;
    display:flex;align-items:center;justify-content:space-between;gap:4px;padding-inline:12px 4px;
    border-radius:0 0 14px 14px;box-shadow:inset 0 .5px 0 rgba(0,0,0,.2);
    background:var(--band,#8E8E93);color:var(--band-ink,#FFFFFF);
    transition:background-color .2s ease,color .2s ease}
  .err .band{background:#636366;color:#FFFFFF}
  .player{min-width:0;font-size:11px;font-weight:600;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctl{flex:none;display:flex;align-items:center;pointer-events:auto;opacity:1;scale:1;
    transition-property:opacity,scale,display;transition-duration:.2s;
    transition-timing-function:cubic-bezier(.32,.72,0,1);transition-behavior:allow-discrete}
  .ctl.off{display:none;opacity:0;scale:.9;transition-duration:.16s}
  @starting-style{.ctl{opacity:0;scale:.9}}
  .count{min-width:14px;font-size:11px;font-weight:600;line-height:1;text-align:center;opacity:.8;
    font-variant-numeric:tabular-nums}
  .nav{position:relative;width:19px;height:19px;border:0;border-radius:6px;background:transparent;color:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .nav::after{content:"";position:absolute;inset:-7px -3px}
  .nav:active{background:rgba(128,128,128,.32)}
  .nav svg{width:10px;height:10px}
  @media(hover:hover) and (pointer:fine){ .nav:hover{background:rgba(128,128,128,.22)} }
  .nav:focus-visible{outline:2px solid currentColor;outline-offset:-2px}
  /* A chevron is a drawing: no logical property points it the other way. */
  [dir="rtl"] .nav svg{transform:scaleX(-1)}

  .window{position:absolute;left:14px;top:99px;width:142px;height:57px;
    background:radial-gradient(135% 135% at 50% 20%,#636366,#48484A 58%,#48484A);
    border-radius:5px 5px 38px 38px;overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.28)}
  .inner{position:absolute;left:-14px;top:-99px;width:170px;height:170px}
  .strand{position:absolute;inset:0;width:170px;height:170px;overflow:visible}
  .strand path{fill:none;stroke-linecap:round;stroke:#0B0B0C;stroke-width:1.3;transition:stroke .2s ease,stroke-width .2s ease}
  .leader .strand path{stroke:rgba(255,255,255,.45);stroke-width:.9}
  .pack{position:absolute;border-radius:50%;transition:opacity .2s ease}
  .tape{background:
    conic-gradient(from 300deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.10) 28deg,rgba(255,255,255,0) 64deg,
      rgba(255,255,255,0) 176deg,rgba(255,255,255,.05) 208deg,rgba(255,255,255,0) 246deg),
    repeating-radial-gradient(circle,#1D1A19 0 1.3px,#25211F 1.3px 2.3px)}
  .clear{background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.18));opacity:0}
  .leader .clear{opacity:1}
  .leader .tape{opacity:0}
  .ring{position:absolute;pointer-events:none}
  .ring svg{display:block;overflow:visible}
  .ring circle{fill:none;stroke:rgba(0,0,0,.7);stroke-width:.5;transition:stroke .2s ease}
  .leader .ring circle{stroke:rgba(255,255,255,.4);stroke-width:.75}
  .reel{position:absolute;rotate:0deg;will-change:rotate}
  .reel svg{display:block}
  .ticks{position:absolute;left:65px;top:31px;display:flex;flex-direction:column;gap:6px;opacity:.5}
  .ticks i{display:block;width:12px;height:2px;background:#FFFFFF;border-radius:1px}
  .glass{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}
  @media(prefers-reduced-motion:reduce){
    .ctl{scale:1}
    .band,.pack,.strand path,.ring circle{transition:none}
  }
</style>
</head>
<body>
<div class="widget idle leader" id="w" role="group" aria-label="Now Playing">
  <div class="np-link" id="np-link"></div>
  <div class="window" id="window">
    <div class="inner">
      <svg class="strand" viewBox="0 0 170 170" aria-hidden="true"><path id="strand"/></svg>
      <div class="pack tape" id="tape"></div>
      <div class="pack clear" id="clear"></div>
      <div class="ring" id="ring"><svg aria-hidden="true"><circle vector-effect="non-scaling-stroke"/></svg></div>
      <div class="reel" id="reel"></div>
    </div>
    <div class="ticks" aria-hidden="true"><i></i><i></i><i></i></div>
    <svg class="glass" viewBox="0 0 142 56" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.17"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/></linearGradient></defs>
      <path transform="translate(-177,-27.8) scale(0.415)" d=" M 577.29 67.02 C 609.06 66.98 640.82 67.00 672.59 67.01 C 683.76 98.92 695.07 130.78 706.19 162.71 C 709.02 170.59 704.38 179.96 696.51 182.67 C 678.35 189.17 660.14 195.56 641.96 202.01 C 635.92 204.29 628.64 202.47 624.43 197.58 C 620.94 193.44 620.07 187.90 618.08 183.00 C 611.55 183.02 605.01 182.95 598.48 183.06 C 598.32 182.00 597.54 180.65 598.97 180.13 C 604.97 179.76 611.01 180.12 617.03 179.99 C 614.45 172.66 611.86 165.33 609.30 157.99 C 612.48 157.99 615.66 157.94 618.84 157.84 C 618.84 157.17 618.83 155.84 618.82 155.17 C 615.35 155.04 611.88 154.98 608.42 154.95 C 608.52 155.71 608.72 157.23 608.82 157.98 C 605.52 157.96 602.20 158.20 598.92 157.88 C 597.58 157.29 598.30 155.94 598.51 154.91 C 601.75 155.01 604.99 155.00 608.24 154.99 C 597.93 125.67 587.62 96.34 577.29 67.02 Z" fill="url(#g)"/>
    </svg>
  </div>
  <div class="sticker">
    <div class="lbl" id="lbl">
      <div class="title" id="title" dir="auto"></div>
      <div class="sub" id="sub" dir="auto"></div>
      <div class="np-cap" id="np-cap" hidden></div>
    </div>
  </div>
  <div class="band">
    <div class="player" id="player" dir="auto"></div>
    <div class="ctl off" id="ctl">
      <button class="nav" id="prev" type="button" aria-label="Previous item">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.4 5.4 9 12l6.4 6.6-1.6 1.6L5.8 12l8-8.2z"/></svg>
      </button>
      <span class="count" id="count" aria-hidden="true"></span>
      <button class="nav" id="next" type="button" aria-label="Next item">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.6 5.4 15 12l-6.4 6.6 1.6 1.6 8-8.2-8-8.2z"/></svg>
      </button>
    </div>
  </div>
  <span class="sr" id="sr" aria-live="polite"></span>
</div>
<script type="module" src="widget.js?v=26d70396"></script>
</body>
</html>
