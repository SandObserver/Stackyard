<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Server</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:transparent;
    font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .widget {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:16px 16px 14px;
    position:relative;
  }
  .widget.clickable { cursor:pointer; }

  .hero { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .pct  { font-size:clamp(26px,9cqw,36px); font-weight:700; color:#FF4245; line-height:1; letter-spacing:-0.02em; transition: color 0.15s ease; }
  .sub  { font-size:clamp(9px,3cqw,11px); font-weight:600; letter-spacing:0.09em; color:rgba(255,255,255,0.5); text-transform:uppercase; }

  .flow { flex:1; min-height:0; margin-top:13px; position:relative; touch-action:pan-y; }
  .flow svg { width:100%; height:100%; display:block; overflow:visible; }
  .link { transition: opacity 0.15s ease; }
  @media (prefers-reduced-motion: reduce) { .pct, .link { transition:none; } }

  .msg { position:absolute; inset-inline:0; bottom:0; }

  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<div class="widget" id="widget" role="group" aria-label="DNS filtering">
  <div class="hero" id="hero">
    <div class="pct" id="pct">—</div>
    <div class="sub" id="sub-label">Queries Blocked</div>
  </div>
  <div class="flow" id="flow">
    <svg id="svg" viewBox="0 0 240 120" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="msg" id="msg" hidden></div>
  </div>
  <div class="sr-only" id="sr"></div>
</div>

<script type="module">
import { poll, fetchData, openUrl, loadStrings, wt, formatNumber, errorState } from '/js/widget-toolbox.js?v=01f4c217';
await loadStrings();
/* These two are in the markup, so the widget still reads correctly in English
   if the catalog fetch fails. */
document.getElementById('sub-label').textContent = wt('ui.queriesBlocked', 'Queries Blocked');
document.getElementById('widget').setAttribute('aria-label', wt('ui.aria', 'DNS filtering'));
const TICK_MS = 30000;
const params = new URLSearchParams(location.search);
const id   = params.get('id')   || '';
const API  = '/api';
const NS   = 'http://www.w3.org/2000/svg';

let _href = '';
let _provider = 'adguard';
let _last = null;

const widgetEl = document.getElementById('widget');
const pctEl = document.getElementById('pct');
const svgEl = document.getElementById('svg');
const subEl = document.getElementById('sub-label');
const msgEl = document.getElementById('msg');
const srEl  = document.getElementById('sr');

/* Digits follow the reader's locale. The k and M suffixes do not: they are
   symbols rather than words, and the catalogue has no translation for them. */
function fmt(n) {
  if (n==null||isNaN(n)) return '—';
  if (n>=1_000_000) return formatNumber(Number((n/1_000_000).toFixed(2)))+'M';
  if (n>=1_000)     return formatNumber(Number((n/1_000).toFixed(1)))+'k';
  return formatNumber(n);
}

async function boot() {
  let cfg = null;
  try {
    const r = await fetch(`${API}/widget-config/${encodeURIComponent(id)}`);
    if (r.ok) cfg = await r.json();
  } catch {}
  _href = cfg?.widgetConfig?.dnsHref || '';
  _provider = cfg?.widgetConfig?.provider || 'adguard';
  if (_href) {
    widgetEl.classList.add('clickable');
    widgetEl.addEventListener('click', () => openUrl(_href));
  }
  poll({ fetch:gfetch, interval:TICK_MS,
    render:d=>{ state.ok(); apply(d); },
    onError:({error,everOk,stale,since})=>{ if(!everOk||stale) state.fail(error,{since,inert:everOk}); } });
  addEventListener('resize', () => { if (_last) render(_last); });
}

const state = errorState({ root: widgetEl, content: [pctEl, svgEl], caption: msgEl });

const gfetch = () => fetchData('stats');

function apply(d) {
  const total   = +d.num_dns_queries || 0;
  const blocked = (+d.num_blocked_filtering || 0)
                + (+d.num_replaced_safebrowsing || 0)
                + (+d.num_replaced_parental || 0);
  const cached  = +d.num_cached || 0;
  const allowed = Math.max(0, total - blocked - cached);
  const pct = total > 0 ? Math.round(blocked / total * 100) : 0;

  const model = { total, allowed, cached, blocked, pct };
  _last = model;
  render(model);
  showHeadline();

  srEl.textContent = wt('ui.summary', '{pct}% of {total} queries blocked. Allowed {allowed}, cached {cached}, blocked {blocked}.')
    .replace('{pct}', formatNumber(pct)).replace('{total}', fmt(total))
    .replace('{allowed}', fmt(allowed)).replace('{cached}', fmt(cached)).replace('{blocked}', fmt(blocked));
}

function constLink(x0,c0,x1,c1,t) {
  const h=t/2, cx=x0+(x1-x0)*0.5;
  return `M${x0},${c0-h} C${cx},${c0-h} ${cx},${c1-h} ${x1},${c1-h} `
       + `L${x1},${c1+h} C${cx},${c1+h} ${cx},${c0+h} ${x0},${c0+h} Z`;
}

const W = 240, H = 120, NODE_W = 8, SRC_SHARE = 0.5;
let _segs = [];
let _sel = -1;

function render(m) {
  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const segs = [
    { key:'allowed', label:wt('ui.allowed','Allowed'), value:m.allowed, color:'#30D158' },
    { key:'cached',  label:wt('ui.cached','Cached'),   value:m.cached,  color:'#0091FF' },
    { key:'blocked', label:wt('ui.blocked','Blocked'), value:m.blocked, color:'#FF4245' },
  ].filter(s => s.value > 0);

  _segs = segs;
  if (_sel >= segs.length) _sel = -1;
  if (!segs.length) { svgEl.innerHTML=''; return; }

  const sum = segs.reduce((a,s)=>a+s.value,0);
  const srcH = H * SRC_SHARE;
  const t = segs.map(s => Math.max(2, s.value / sum * srcH));
  const tSum = t.reduce((a,b)=>a+b,0);
  const gap = segs.length > 1 ? (H - tSum) / (segs.length - 1) : 0;
  const x0 = NODE_W, x1 = W - NODE_W;

  let sy = (H - tSum) / 2;
  let ty = segs.length > 1 ? 0 : (H - tSum) / 2;
  let links = '', nodes = '';
  segs.forEach((s,i) => {
    s.sy = sy + t[i]/2; s.ty = ty + t[i]/2; s.t = t[i];
    links += `<path class="link" d="${constLink(x0,s.sy,x1,s.ty,t[i])}" fill="${s.color}" fill-opacity="0.6"/>`;
    nodes += `<rect x="${x1}" y="${ty}" width="${NODE_W}" height="${t[i]}" rx="${Math.min(4,t[i]/2)}" fill="${s.color}"/>`;
    sy += t[i]; ty += t[i] + gap;
  });
  nodes = `<rect x="0" y="${(H - tSum) / 2}" width="${NODE_W}" height="${tSum}" rx="4" fill="#fff"/>` + nodes;

  svgEl.innerHTML = links + nodes;
  highlight();
}

function ribbonY(s, x) {
  const u = Math.min(1, Math.max(0, (x - NODE_W) / (W - 2*NODE_W)));
  return s.sy + (s.ty - s.sy) * (3*u*u - 2*u*u*u);
}

function highlight() {
  svgEl.querySelectorAll('.link').forEach((p,i) => {
    p.style.opacity = _sel < 0 || i === _sel ? '1' : '0.3';
  });
}

function showHeadline() {
  const s = _segs[_sel];
  if (s) {
    pctEl.textContent = fmt(s.value);
    pctEl.style.color = s.color;
    subEl.textContent = s.label;
  } else if (_last) {
    pctEl.textContent = formatNumber(_last.pct / 100, { style: 'percent' });
    pctEl.style.color = '';
    subEl.textContent = wt('ui.queriesBlocked', 'Queries Blocked');
  }
}

function select(i) {
  if (i === _sel) return;
  _sel = i;
  highlight();
  showHeadline();
}

function pick(e) {
  if (!_segs.length) return;
  const r = flowEl.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const x = (e.clientX - r.left) / r.width * W;
  const y = (e.clientY - r.top) / r.height * H;
  let best = 0, bestD = Infinity;
  _segs.forEach((s,i) => {
    const d = Math.abs(ribbonY(s, x) - y) - s.t/2;
    if (d < bestD) { bestD = d; best = i; }
  });
  select(best);
}

const flowEl = document.getElementById('flow');
flowEl.addEventListener('pointermove', pick);
flowEl.addEventListener('pointerdown', pick);
for (const type of ['pointerleave', 'pointercancel']) flowEl.addEventListener(type, () => select(-1));
flowEl.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') select(-1); });

boot();
</script>
</body>
</html>
