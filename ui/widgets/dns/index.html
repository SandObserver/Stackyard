<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Server</title>
<script src="/js/widget-theme.js?v=2551d2fb"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:transparent;
    font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .widget {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:16px 16px 14px;
    position:relative;
  }
  .widget.clickable { cursor:pointer; }
  .widget.clickable:focus-visible{outline:2px solid #0091FF;outline-offset:-3px}

  .hero { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .pct  { font-size:clamp(26px,9cqw,36px); font-weight:700; color:#FF4245; line-height:1; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; transition: color 0.15s ease; }
  .sub  { font-size:clamp(11px,3.6cqw,13px); font-weight:600; color:rgba(235,235,245,0.6); }

  .flow { flex:1; min-height:0; margin-top:13px; position:relative; touch-action:pan-y; }
  .flow svg { width:100%; height:100%; display:block; overflow:visible; }
  .link { transition: opacity 0.15s ease; }
  @media (prefers-reduced-motion: reduce) { .pct, .link { transition:none; } }

  .msg { position:absolute; inset-inline:0; bottom:0; }
  .flow.ph { color:rgba(235,235,245,0.16); }
  .flow.ph .src-node { fill:currentColor; }
  html[data-theme="light"] .flow.ph { color:rgba(60,60,67,0.12); }

  .legend { display:flex; flex-wrap:wrap; gap:2px 10px; margin-top:8px; flex-shrink:0;
    font-size:11px; font-weight:600; line-height:1.2; color:rgba(235,235,245,0.6); }
  .legend[hidden] { display:none; }
  .legend span { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .legend i { width:6px; height:6px; border-radius:50%; background:var(--c); }

  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .src-node { fill:#fff }
  html[data-theme="light"] .src-node { fill:#1c1c1e }
  html[data-theme="light"] .sub, html[data-theme="light"] .legend { color:rgba(0,0,0,0.62) }
  /* Keep. The solid-card ink falls below 4.5:1 on glass over a bright wallpaper. */
  html[data-glass] .sub, html[data-glass] .legend { color:var(--glass-ink-2) }
  @media (prefers-contrast:more) {
    .sub, .legend { color:#EBEBF5 }
    html[data-theme="light"] .sub, html[data-theme="light"] .legend { color:#3C3C43 }
  }
</style>
</head>
<body>
<div class="widget" id="widget" role="group" aria-label="DNS filtering">
  <div class="hero" id="hero">
    <div class="pct" id="pct"></div>
    <div class="sub" id="sub-label">Queries Blocked</div>
  </div>
  <div class="flow" id="flow">
    <svg id="svg" viewBox="0 0 240 120" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="msg" id="msg" hidden></div>
  </div>
  <div class="legend" id="legend" aria-hidden="true" hidden></div>
  <div class="sr-only" id="sr"></div>
</div>

<script type="module" src="widget.js?v=6beeff6a"></script>
</body>
</html>
