<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Books</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif}

  .card{position:relative;width:100%;height:100%;border-radius:inherit;
    overflow:hidden;padding:14px;display:flex;flex-direction:column}
  .card.clickable{cursor:pointer}
  .card.clickable:focus-visible{outline:2px solid #00D2E0;outline-offset:-3px}

  .head{display:flex;justify-content:space-between;align-items:center;flex:none}
  .head .lbl{font-size:11px;font-weight:500;color:#8E8E93;letter-spacing:.05em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head svg{width:13px;height:13px;color:#636366;flex:none}

  .shelves{flex:1;display:flex;flex-direction:column;min-height:0}
  .shelf-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
  .shelf-lbl{flex:none;font-size:9px;font-weight:600;color:#636366;letter-spacing:.06em;margin-top:5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shelf-lbl[hidden]{display:none}
  .shelf{flex:1;position:relative;padding-bottom:9px;margin-top:6px;perspective:520px}
  .size-large .shelf{margin-top:2px}
  .books{list-style:none;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#636366;font-size:11px}

  .bk{flex-shrink:0;border-top-left-radius:2px;border-top-right-radius:2px;position:relative;
    display:flex;align-items:center;justify-content:center;border:.5px solid rgba(0,0,0,.25);
    border-top:1px solid rgba(255,255,255,.18);transform-origin:center bottom;
    transition:transform .18s cubic-bezier(.22,.7,.3,1),box-shadow .18s,filter .18s;will-change:transform}
  .bk::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1.5px;background:rgba(255,250,240,.22)}
  .bk:focus{outline:none}
  .bk.up{transform:translateZ(16px) translateY(-5px);z-index:5;
    box-shadow:-3px 6px 14px rgba(0,0,0,.55);filter:brightness(1.08)}

  .spine{writing-mode:vertical-rl;text-orientation:mixed;font-size:8px;letter-spacing:.4px;
    line-height:1;font-weight:600;white-space:nowrap;overflow:hidden;max-height:84%;
    text-overflow:ellipsis;pointer-events:none}
  .ribbon{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:6px;height:11px;
    clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);background:#C9A227;pointer-events:none}
  .deco{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:60%;
    display:flex;flex-direction:column;gap:2px;pointer-events:none}
  .deco span{display:block;height:1px;background:rgba(255,255,255,.32)}

  .ledge{position:absolute;left:0;right:0;bottom:0;height:7px;background:#4a3018}
  .ledge-top{position:absolute;left:0;right:0;bottom:7px;height:1.5px;background:#6b4a28}

  /* Inset to the card's own padding. At the edge it sat under the rounded
     corner and read as part of the tile rather than a layer over it. */
  .info{position:absolute;left:14px;right:14px;top:14px;padding:10px 12px 11px;border-radius:10px;
    background:linear-gradient(180deg,rgba(18,18,18,.97),rgba(18,18,18,.90));
    border:.5px solid rgba(255,255,255,.08);
    box-shadow:0 6px 18px rgba(0,0,0,.34);
    opacity:0;transform:translateY(-4px);transition:opacity .16s,transform .16s;pointer-events:none}
  .info.show{opacity:1;transform:translateY(0)}
  .info .t{font-size:13px;font-weight:600;color:#FFFFFF;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .info .a{font-size:11px;color:#8E8E93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .info .p{font-size:10px;font-weight:600;letter-spacing:.03em;color:#0091FF;margin-top:3px}
  .info .p.done{color:#30D158}.info .p.none{color:#8E8E93}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media(prefers-reduced-motion:reduce){
    .bk,.info{transition:none!important}
    .bk.up{transform:translateY(-3px)!important}
  }
</style>
</head>
<body>
<div class="card" id="card" role="group" aria-label="Books">
  <div class="head">
    <span class="lbl" id="lbl">READING</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1z"/></svg>
  </div>
  <div class="shelves" id="shelves">
    <div class="shelf-wrap">
      <span class="shelf-lbl" hidden></span>
      <div class="shelf" id="shelf">
        <ul class="books" id="books"></ul>
        <div class="ledge-top" aria-hidden="true"></div><div class="ledge" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <div class="info" id="info" aria-hidden="true">
    <div class="t" id="i-t"></div><div class="a" id="i-a"></div><div class="p" id="i-p"></div>
  </div>
  <span class="sr" id="sr" aria-live="polite"></span>
</div>
<script type="module">
  import { poll, openUrl, loadStrings, wt, formatNumber } from '/js/widget-toolbox.js?v=432c5712';
  await loadStrings();
  document.getElementById('lbl').textContent = wt('ui.reading', 'READING');
  document.getElementById('card').setAttribute('aria-label', wt('widget.label', 'Books'));
  const API='/api';
  const params=new URLSearchParams(location.search);
  const id=params.get('id')||'';
  const SIZES={small:{shelves:1,show:8},medium:{shelves:1,show:16},large:{shelves:3,show:16}};
  const size=SIZES[params.get('size')]?params.get('size'):'small';
  const {shelves:SHELVES,show:SHOW}=SIZES[size];
  const POLL_MS=300000;
  const PALETTE=['#8E8E93','#008575','#956D51','#48484A','#008198','#A16A00','#C55300'];
  const SRC_LABEL={recently:'RECENTLY ADDED',unread:'ON DECK',list:'READING'};

  const card=document.getElementById('card'), lbl=document.getElementById('lbl');
  const host=document.getElementById('shelves');
  const tpl=host.firstElementChild;
  card.classList.add('size-'+size);
  const bays=[];
  for(let i=0;i<SHELVES;i++){
    const w=i===0?tpl:tpl.cloneNode(true);
    if(i>0){ w.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id')); host.appendChild(w); }
    bays.push({ shelf:w.querySelector('.shelf'), list:w.querySelector('.books'), lbl:w.querySelector('.shelf-lbl') });
  }
  const info=document.getElementById('info'), iT=document.getElementById('i-t'), iA=document.getElementById('i-a'), iP=document.getElementById('i-p'), sr=document.getElementById('sr');
  let href='';

  function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function lum(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return 0.3;const n=parseInt(m[1],16);
    const r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;return 0.2126*r+0.7152*g+0.0722*b;}
  function progressText(b){
    if(b.finished) return [wt('ui.finished','Finished'),'done'];
    if(b.progress!=null) return [wt('ui.percentRead','{pct}% read').replace('{pct}',formatNumber(Math.round(b.progress*100))),'reading'];
    return [wt('ui.unread','Unread'),'none'];
  }
  function showInfo(b){
    iT.textContent=b.title||''; iA.textContent=b.author||'';
    const [txt,cls]=progressText(b); iP.textContent=txt; iP.className='p '+(cls==='done'?'done':cls==='none'?'none':'');
    info.classList.add('show'); info.setAttribute('aria-hidden','false');
    sr.textContent=(b.title||'')+(b.author?' by '+b.author:'')+', '+txt;
  }
  function hideInfo(){ info.classList.remove('show'); info.setAttribute('aria-hidden','true'); }

  function render(books,list,shelf){
    list.innerHTML='';
    shelf.querySelectorAll('.empty').forEach(n=>n.remove());
    /* Removing the bullets drops the list semantics in one engine, so the role
       is declared even on a real list. It is set only while there are rows: an
       empty list that declares the role reports as missing its children. */
    list.removeAttribute('role');
    if(!books.length){ const e=document.createElement('div'); e.className='empty'; e.textContent=wt('ui.noBooks','No books'); shelf.appendChild(e); return; }
    list.setAttribute('role','list');
    const tallestIdx=books.reduce((mi,b,i,a)=>(b._h>a[mi]._h?i:mi),0);
    books.forEach((b,i)=>{
      const el=document.createElement('li'); el.className='bk';
      el.style.width=b._w+'px'; el.style.height=b._h+'px'; el.style.background=b._color;
      const dark = lum(b._color) > 0.62;
      const sp=document.createElement('span'); sp.className='spine';
      sp.style.color = dark ? 'rgba(20,20,20,.9)' : 'rgba(255,255,255,.85)';
      sp.textContent=(b.title||'').toUpperCase();
      if(i===tallestIdx){ const rb=document.createElement('div'); rb.className='ribbon'; el.appendChild(rb); }
      if(b._w>=17){ const d=document.createElement('div'); d.className='deco'; d.innerHTML='<span></span><span></span>'; el.appendChild(d); }
      el.appendChild(sp);
      el.tabIndex=0;
      const [ptxt]=progressText(b);
      el.setAttribute('aria-label',(b.title||wt('ui.untitled','Untitled'))+(b.author?' '+wt('ui.by','by')+' '+b.author:'')+', '+ptxt);
      const on=()=>{ el.classList.add('up'); showInfo(b); };
      const off=()=>{ el.classList.remove('up'); hideInfo(); };
      el.addEventListener('mouseenter',on); el.addEventListener('mouseleave',off);
      el.addEventListener('focus',on); el.addEventListener('blur',off);
      list.appendChild(el);
    });
  }

  function decorate(books){
    return books.map((b,i)=>{
      const h=hash((b.title||'')+'|'+i);
      return Object.assign({}, b, {
        _w: 13 + (h % 7),
        _h: 48 + (h % 31),
        _color: b.color || PALETTE[(h>>4) % PALETTE.length],
      });
    });
  }

  async function boot(){
    try{
      const r=await fetch(`${API}/widget-config/${encodeURIComponent(id)}`);
      if(r.ok){ const c=await r.json(); href=(c&&c.widgetConfig&&c.widgetConfig.href)||''; }
    }catch(e){}
    if(href){
      card.classList.add('clickable'); card.setAttribute('role','link'); card.tabIndex=0;
      const go=()=>openUrl(href);
      card.addEventListener('click',e=>{ if(e.target===card||e.target.closest('.head')) go(); });
      card.addEventListener('keydown',e=>{ if(e.key==='Enter'){ go(); } });
    }
    poll({ interval:POLL_MS, render:d=>{
      const shelves=Array.isArray(d.shelves)?d.shelves:[{source:d.source,books:d.books}];
      lbl.textContent=SHELVES>1?wt('widget.label','Books'):(SRC_LABEL[shelves[0]&&shelves[0].source]||'READING');
      bays.forEach((bay,i)=>{
        const sh=shelves[i]||{books:[]};
        bay.lbl.hidden=SHELVES<2;
        bay.lbl.textContent=SRC_LABEL[sh.source]||'READING';
        render(decorate((Array.isArray(sh.books)?sh.books:[]).slice(0,SHOW)),bay.list,bay.shelf);
      });
    } });
  }
  boot();
</script>
</body>
</html>
