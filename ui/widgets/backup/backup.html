<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backup</title>
<script src="/js/widget-theme.js?v=2551d2fb"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  html { -webkit-tap-highlight-color: transparent; }

  .widget {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 10px; box-sizing: border-box;
  }
  #cards {
    flex: 1; min-height: 0;
    display: flex; align-items: stretch; justify-content: center; gap: 12px;
  }
  .bk-cap { flex: none; padding-top: 6px; }

  /* Mobile is detected by body height <= 200px, or an aspect ratio above 1.5 for
     a medium slot. */
  .card-wrap {
    position: relative; border-radius: 10px; overflow: hidden;
    flex-shrink: 0;
    /* Height always fills the widget (minus padding) */
    align-self: stretch;
  }
  .card-wrap.clickable { cursor: pointer; }
  .card-wrap.clickable:focus-visible { outline: 2px solid #0091FF; outline-offset: 2px; filter: none; }
  .card-wrap.inactive  { opacity: 0.38; pointer-events: none; }

  /* Back card */
  .card-back {
    position: absolute; inset: 0; border-radius: 10px;
    transition: background 0.3s ease;
    background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .card-back canvas {
    position: absolute; top: 0; left: 0; right: 0;
    width: 100%; height: 100%;
    display: block;
  }

  .card-name-zone {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 4px 7px 8px;
    display: flex; flex-direction: column; justify-content: flex-end;
    /* Opaque strip in the card's own colour, so the placeholder can run full
       height behind it. */
    background: inherit;
  }
  .card-back-meta {
    font-size: 11px; font-weight: 500; opacity: 0.85; line-height: 1.3;
    flex-shrink: 0; margin-bottom: 2px;
  }
  .card-back-name {
    font-size: 11px; font-weight: 700; line-height: 1.18;
    flex-shrink: 0;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-back-name.cut, .card-front-name.cut { display: block; white-space: nowrap; text-overflow: ellipsis; }
  .off .sync-icon { animation-play-state: paused; }

  /* Front card */
  .card-front {
    position: absolute; inset: 0; border-radius: 10px;
    background: #FFFFFF;
    transition: opacity 0.22s ease;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    overflow: hidden;
  }
  .card-front::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 0; height: 0; border-style: solid;
    border-width: 0 20px 20px 0;
    border-color: transparent var(--status-color, rgba(100,100,110,0.22)) transparent transparent;
    border-radius: 0 10px 0 0;
  }
  .card-front::after {
    content: ''; position: absolute; top: 1px; right: 20px;
    width: 20px; height: 1px; background: rgba(0,0,0,0.10);
    transform-origin: right top; transform: rotate(45deg);
  }
  .card-front canvas {
    position: absolute; top: 0; left: 0; right: 0;
    width: 100%; height: 100%;
    display: block;
  }
  .card-wrap:focus-visible .card-front,
  .card-wrap:active .card-front { opacity: 0; }
  @media (hover: hover) and (pointer: fine) {
    .card-wrap:hover .card-front { opacity: 0; }
  }

  .card-front-name-zone {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 4px 7px 8px;
    background: #FFFFFF;
  }
  .card-front-name {
    font-size: 11px; font-weight: 700; color: #1c1c1e;
    line-height: 1.18;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  .sync-icon {
    display: inline-block; width: 10px; height: 10px;
    margin-inline-end: 3px; vertical-align: middle; opacity: 0.85;
    animation: spin 1.4s linear infinite;
  }
  .sync-icon svg { display: block; width: 100%; height: 100%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="widget" id="widget" role="group" aria-label="Backup status"></div>
<script type="module" src="backup.js?v=1543917c"></script>
</body>
</html>
