<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>
<script src="/js/widget-theme.js?v=db11b06d"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }

  :root { --hour: #3FBCF2; --minute: #FE3A86; --overlap: #633680; --date: rgba(255,255,255,0.55); --card: #1c1c1e; }
  :root[data-theme="light"] { --hour: #0A84C8; --minute: #E0246F; --overlap: #4A2470; --date: rgba(0,0,0,0.55); --card: #ffffff; }

  .widget { position: relative; width: 100%; height: 100%; background: var(--card); }

  #time-block { position: absolute; inset: 0; }
  #time-block svg { display: block; width: 100%; height: 100%; }
  .fig { font-size: 80px; font-weight: 250; }
  #hh { fill: var(--hour); }
  #mm { fill: var(--minute); }
  #hh-over { fill: var(--overlap); }

  .date-line {
    position: absolute; left: 6vmin; right: 6vmin; bottom: 8.1vmin;
    font-size: 8.1vmin; font-weight: 500; line-height: 1.2;
    text-align: center; white-space: nowrap; overflow: hidden;
    color: var(--date);
  }
</style>
</head>
<body>
<div class="widget" id="widget" role="img" aria-label="Clock">
  <div id="time-block" dir="ltr" aria-hidden="true"><svg viewBox="2.5 1 148 148">
    <defs><clipPath id="mm-shape"><text class="fig" id="mm-clip" x="52"></text></clipPath></defs>
    <text class="fig" id="mm" x="52"></text>
    <text class="fig" id="hh" x="12"></text>
    <text class="fig" id="hh-over" x="12" clip-path="url(#mm-shape)"></text>
  </svg></div>
  <div class="date-line" id="date-line" aria-hidden="true"></div>
</div>
<script>
const id  = new URLSearchParams(location.search).get('id') || '';
const API = '/api';

let _timezone = '';
let _showDate = true;
let _tickId   = null;

const _lang = new URLSearchParams(location.search).get('lang') || 'en';
let _dateLong = null, _dateShort = null;
function _a11yLabel(now){
  const hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');
  return `${hh}:${mm}, ${_dateLong(now)}`;
}

const _two = (() => {
  const opts = { minimumIntegerDigits: 2, useGrouping: false };
  try { return new Intl.NumberFormat(_lang, opts); }
  catch { return new Intl.NumberFormat('en', opts); }
})();

function layout() {
  const [hy, my] = _showDate ? [82, 116] : [88, 124];
  for (const k of ['hh', 'hh-over']) document.getElementById(k).setAttribute('y', hy);
  for (const k of ['mm', 'mm-clip']) document.getElementById(k).setAttribute('y', my);
  document.getElementById('date-line').style.display = _showDate ? '' : 'none';
}

function fitDate(el) {
  el.style.fontSize = '';
  let size = 8.1;
  while (el.scrollWidth > el.clientWidth && size > 5) {
    size -= 0.3;
    el.style.fontSize = size + 'vmin';
  }
}

/* An unknown zone makes every toLocaleString call throw, so the clock never
   draws. */
function zoneOk(z) {
  try { new Intl.DateTimeFormat('en-US', { timeZone: z || undefined }); return true; }
  catch { return false; }
}
async function showZoneError() {
  const w = document.getElementById('widget');
  const { errorState, loadStrings, wt } = await import('/js/widget-toolbox.js?v=556ee947');
  await loadStrings();
  const line = wt('ui.unknownZone', 'Unknown timezone');
  errorState({ root: w, place: 'center' }).empty(line);
  w.setAttribute('aria-label', line);
}

function tick() {
  const now = _timezone
    ? new Date(new Date().toLocaleString('en-US', { timeZone: _timezone }))
    : new Date();
  document.getElementById('widget').setAttribute('aria-label', _a11yLabel(now));
  const hh = _two.format(now.getHours()), mm = _two.format(now.getMinutes());
  for (const k of ['hh', 'hh-over']) document.getElementById(k).textContent = hh;
  for (const k of ['mm', 'mm-clip']) document.getElementById(k).textContent = mm;
  if (_showDate) {
    const dl = document.getElementById('date-line');
    dl.textContent = _dateShort(now);
    fitDate(dl);
  }
  if (_tickId) clearTimeout(_tickId);
  _tickId = setTimeout(tick, (60 - now.getSeconds()) * 1000);
}

async function boot() {
  try {
    const r = await fetch(`${API}/widget-config/${encodeURIComponent(id)}`);
    if (r.ok) { const d = await r.json(); const wc = d.widgetConfig||{};
      _timezone = wc.clockTimezone || '';
      _showDate = wc.clockShowDate !== false;
    }
  } catch {}
  if (!zoneOk(_timezone)) return showZoneError();
  const { clockDateFormatter } = await import('/js/clock-date.js?v=978eaa4f');
  _dateLong = clockDateFormatter(_lang, 'long');
  _dateShort = clockDateFormatter(_lang, 'short');
  layout();
  tick();
}

boot();
</script>
</body>
</html>
