<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock</title>
<script src="/js/widget-theme.js?v=9f9e1b99"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }

  .widget {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
  }
  .mode-dark  { background: #1c1c1e; }
  .mode-light { background: #ffffff; }

  .face { display: block; }
  .face text {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-weight: 500; text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<div class="widget mode-dark" id="widget" role="img" aria-label="Clock">
  <svg class="face" id="face" aria-hidden="true"></svg>
</div>
<script src="analog.js?v=ce7333c8"></script>
</body>
</html>
