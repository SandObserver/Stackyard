<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Stats</title>
<script src="/js/widget-theme.js?v=db11b06d"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1C1C1E;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }

  .widget { width: 100%; height: 100%; font-variant-numeric: tabular-nums; }
  .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 600; color: #8E8E93; }
  .val { white-space: nowrap; font-weight: 700; line-height: 1.1; color: var(--ink); }

  .size-small { display: flex; flex-direction: column; justify-content: space-evenly; padding: 16px; }
  .size-small .row { display: flex; align-items: center; gap: 8px; }
  .size-small .lbl { flex: 1; font-size: 13px; }
  .size-small .val { font-size: 22px; letter-spacing: -0.01em; }

  /* One grid for every row, so the charts start at the same x whatever the
     longest label is in the reader's language. */
  .size-medium { display: grid; grid-template-columns: minmax(56px, max-content) minmax(0, 1fr);
    column-gap: 16px; align-content: space-between; align-items: center; padding: 15px 20px 14px 18px; }
  .size-medium .row { display: contents; }
  .size-medium .head { display: flex; flex-direction: column; min-width: 0; }
  .size-medium .lbl { max-width: 104px; }
  .size-medium .lbl { font-size: 12px; line-height: 1.2; }
  .size-medium .val { font-size: 19px; }
  .plot { height: 100%; max-height: 30px; }
  .size-medium .cap { grid-column: 1 / -1; }
  .disk { display: flex; flex-direction: column; gap: 4px; }
  .second .tb-bar-fill { opacity: 0.7; }

  .tb-bar, .tb-col { background-color: rgba(255,255,255,0.12); }
  .net { grid-column: 2; display: flex; gap: 12px; font-size: 11px; font-weight: 500;
    color: #8E8E93; white-space: nowrap; }
  .net-item { display: inline-flex; align-items: center; gap: 2px; }

  html[data-theme="light"], html[data-theme="light"] body { background: #FFFFFF; }
  html[data-theme="light"] .lbl, html[data-theme="light"] .net { color: #6C6C70; }
  html[data-theme="light"] .tb-bar, html[data-theme="light"] .tb-col { background-color: rgba(0,0,0,0.07); }

  @media (forced-colors: active) {
    .tb-bar, .tb-col { forced-color-adjust: none; background-color: Canvas !important;
      outline: 1px solid CanvasText; outline-offset: -1px; }
    .tb-bar-fill, .tb-col-fill { forced-color-adjust: none; background-color: Highlight !important; }
  }
</style>
</head>
<body>
<p id="sr-sum" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:-1px;"></p>
<!-- dir="ltr", not inherited from the page. This widget is percentages, byte
     counts and charts: content with its own direction. Mirroring it runs the
     charts' time axis right to left. -->
<div class="widget" id="widget" aria-hidden="true" dir="ltr"></div>
<script type="module">
import { contrastInk, colorOrFallback, columns, barFill, poll, fetchData, html, setHtml, loadStrings, wt, formatNumber, errorState } from '/js/widget-toolbox.js?v=9ee71c7a';
await loadStrings();
const REFRESH_SECONDS = ['5', '10', '30', '60'];
const SPEED_MS = 60000;
const THROUGHPUT_MS = 3000;
/* Every tick is a call to someone else's server, so a remote source is read at
   the same rate as the rest of the widget rather than every three seconds. */
const REMOTE_THROUGHPUT_MS = 10000;
const SEED_STEP_MS = 10000;
const COLS = 24;
const SLOT_DEFS = ['#FF375F', '#30D158', '#00D2E0'];
const DEFAULT_SLOTS = [{ type: 'cpu' }, { type: 'ram' }, { type: 'disk', primary: '/' }];
const id       = new URLSearchParams(location.search).get('id') || '';
const API      = '/api';

let cfg = null;      /* widget config from /api/widget-config/:id */
const isRemote = () => (cfg?.widgetConfig?.statProvider || 'system') !== 'system';
let tickMs = 10000;
let medium = true;
let lastSampleAt = 0;

/* One entry per slot: { vals } holds the newest COLS readings, oldest first. */
const history = [{}, {}, {}];
/** @type {{ slot: any, label: string, el: HTMLElement, val: HTMLElement, chart?: ReturnType<typeof columns>, bar?: HTMLElement, bar2?: HTMLElement }[]} */
const rows = [];

const LABELS = {
  cpu: ['slots.type.opt.cpu', 'CPU'],
  ram: ['slots.type.opt.ram', 'RAM'],
  temp: ['slots.type.opt.temp', 'Temperature'],
  disk: ['row.disk', 'Disk'],
  iowait: ['slots.type.opt.iowait', 'IO Wait'],
  procs: ['slots.type.opt.procs', 'Processes'],
};
/* slot.type comes from config, which can arrive by import, so an unknown type
   falls back to its own text, which is only ever written as text. */
function slotLabel(slot) {
  const l = LABELS[slot?.type];
  return l ? wt(l[0], l[1]) : String(slot?.type || '');
}

function slotColour(slot, i) {
  const c = colorOrFallback(slot?.color, SLOT_DEFS[i] || SLOT_DEFS[0]);
  return /^#[0-9a-f]{3}$/i.test(c) ? '#' + [...c.slice(1)].map(x => x + x).join('') : c;
}

function refreshSeconds(wc) {
  const v = String(wc?.refresh ?? '10');
  return REFRESH_SECONDS.includes(v) ? Number(v) : 10;
}

async function boot() {
  try {
    const r = await fetch(`${API}/widget-config/${id}`);
    if (r.ok) cfg = await r.json();
  } catch {}
  if (!cfg) cfg = { widgetType: 'system-summary', widgetSize: 'medium', widgetConfig: {} };

  const wc = cfg.widgetConfig || {};
  tickMs = refreshSeconds(wc) * 1000;
  medium = (cfg.widgetSize || 'medium') === 'medium';
  buildShell();
  new MutationObserver(applyInks).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  if (medium) startNetwork(wc.network || {});

  const widgetEl = document.getElementById('widget');
  /* The caption sits inside the widget, and a faded element fades everything
     in it, so only the content around the caption is named. */
  const state = errorState({ root: document.body, caption: document.getElementById('cap'),
    content: () => [...widgetEl.querySelectorAll(medium ? '.head, .plot, .disk, .net' : '.row')] });

  poll({ fetch: fetchStats, interval: tickMs,
    render: d => { state.ok(); applyStats(d); },
    onError: ({ error, everOk, stale, since }) => {
      if (everOk && !stale) return;
      const line = state.fail(error, { since, inert: everOk });
      /* #widget is aria-hidden, so the summary paragraph is the only thing a
         screen reader reads here. */
      const sum = document.getElementById('sr-sum');
      if (sum) sum.textContent = line;
    } });
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function buildShell() {
  const w = document.getElementById('widget');
  const wc = cfg.widgetConfig || {};
  const configured = Array.isArray(wc.slots) ? wc.slots.filter(s => s && typeof s === 'object').slice(0, 3) : [];
  const slots = configured.length ? configured : DEFAULT_SLOTS;
  const net = medium && wc.network?.enabled ? wc.network : null;

  w.className = 'widget ' + (medium ? 'size-medium' : 'size-small');
  if (medium) w.style.gridTemplateRows = `repeat(${slots.length}, 1fr) auto auto`;
  slots.forEach((slot, i) => {
    const label = slotLabel(slot);
    const colour = slotColour(slot, i);
    const row = el('div', 'row');
    const lbl = el('span', 'lbl', label);
    const val = el('span', 'val', '—');
    const entry = { slot, label, colour, el: row, val };
    history[i].vals = Array(COLS).fill(null);

    if (!medium) {
      row.append(lbl, val);
    } else {
      const head = el('div', 'head');
      head.append(lbl, val);
      row.append(head);
      if (slot.type === 'disk') {
        const box = el('div', 'disk');
        entry.bar = barFill(0, { height: 8, radius: 4, track: null, color: colour });
        box.append(entry.bar);
        if (slot.secondary) {
          entry.bar2 = barFill(0, { height: 4, radius: 2, track: null, color: colour });
          entry.bar2.classList.add('second');
          box.append(entry.bar2);
        }
        row.append(box);
      } else {
        entry.chart = columns({ count: COLS, color: colour, track: null });
        const plot = el('div', 'plot');
        plot.append(entry.chart.el);
        row.append(plot);
      }
    }
    w.append(row);
    rows.push(entry);
  });

  if (net) {
    const n = el('div', 'net');
    n.id = 'net-val';
    setHtml(n, netRowHtml(net));
    w.append(n);
  }
  const cap = el('div', 'cap');
  cap.id = 'cap';
  w.append(cap);
  applyInks();
}

/* The host theme can change while the widget is open, and a user colour can be
   too faint on either card. Text needs 4.5:1; a fill only needs to show. */
function applyInks() {
  for (const r of rows) {
    r.el.style.setProperty('--ink', contrastInk(r.colour, 4.5));
    const fill = contrastInk(r.colour, 1.5);
    if (r.chart) r.chart.setColor(fill);
    for (const bar of [r.bar, r.bar2]) if (bar) bar.firstElementChild.style.backgroundColor = fill;
  }
}

const ARROW_DOWN = html`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>`;
const ARROW_UP = html`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V5M6 11l6-6 6 6"/></svg>`;

function netRowHtml(net) {
  if ((net.mode || 'speed') === 'uptime') {
    return html`<span class="net-item" dir="auto">${wt('network.mode.opt.uptime', 'Uptime')} <span id="net-uptime">—</span></span>`;
  }
  return html`<span class="net-item">${ARROW_DOWN}<span id="net-dn">—</span></span><span class="net-item">${ARROW_UP}<span id="net-up">—</span></span>`;
}

function startNetwork(net) {
  if (!net.enabled) return;
  const mode = net.mode || 'speed';
  /* Uptime mode needs no extra poll, it updates from the stats loop. */
  const netFailed = on => {
    const row = document.getElementById('net-val');
    if (row) row.classList.toggle('wt-inert', on);
    if (!on) return;
    for (const name of ['net-dn', 'net-up', 'net-uptime']) {
      const n = document.getElementById(name);
      if (n) n.textContent = '—';
    }
  };
  if (mode === 'speed')
    poll({ fetch: fetchSpeed, interval: SPEED_MS,
      render: d => { netFailed(false); applySpeed(d); },
      onError: ({ stale }) => { if (stale) netFailed(true); } });
  if (mode === 'throughput')
    poll({ fetch: fetchThroughput, interval: isRemote() ? Math.max(REMOTE_THROUGHPUT_MS, tickMs) : THROUGHPUT_MS,
      render: d => { netFailed(false); applyThroughput(d); },
      onError: ({ stale }) => { if (stale) netFailed(true); } });
}

/* Takes the tail of a supplied past, one point per tick, and leaves room for
   the live value the same tick appends. Runs once per slot, while the chart
   still holds no readings. */
function seedFromPast(slot, i, past, step = 1) {
  const h = history[i].vals;
  if (!past || history[i].seeded || h.some(v => v !== null)) return;
  history[i].seeded = true;

  let src = null;
  if (slot.type === 'cpu') src = past.cpu;
  else if (slot.type === 'ram') src = past.ram;
  else if (slot.type === 'iowait') src = past.iowait;
  else if (slot.type === 'procs') src = past.procs;
  else if (slot.type === 'temp') {
    const key = slot.sensor ? slot.sensor : (Number.isInteger(slot.thermalZone) ? slot.thermalZone : 0);
    src = past.temps?.[key];
  }
  if (!Array.isArray(src) || !src.length) return;

  const want = h.length - 1;
  const tail = [];
  for (let k = src.length - step; k >= 0 && tail.length < want; k -= step) tail.unshift(src[k]);
  history[i].vals = Array(h.length - tail.length).fill(null).concat(tail);
}

/* Upstream values arrive from four different sources and an import; anything
   that is not a finite, non-negative number is no reading. */
const reading = v => (typeof v === 'number' && Number.isFinite(v) && v >= 0 ? v : null);

function readingFor(slot, data) {
  if (slot.type === 'cpu') return reading(data.cpu);
  if (slot.type === 'ram') return reading(data.ram);
  if (slot.type === 'iowait') return reading(data.iowait);
  if (slot.type === 'procs') return reading(data.procs);
  if (slot.type === 'temp') {
    /* A slot names either a thermal zone or a sensor, depending on the source */
    const key = slot.sensor ? slot.sensor : (Number.isInteger(slot.thermalZone) ? slot.thermalZone : 0);
    return reading(data.temps?.[key]);
  }
  return null;
}

function valueText(type, v) {
  if (v === null) return '—';
  if (type === 'temp') return formatNumber(Math.round(v)) + '°';
  if (type === 'procs') return formatNumber(Math.round(v));
  return formatNumber(Math.round(Math.min(v, 100))) + '%';
}

/* A process count has no ceiling, so its columns span the window's own low to
   high, and the readings above the window's mean are the ones drawn at full
   strength. Everything else is a share of 100. */
function scaleFor(type, vals) {
  if (type !== 'procs') return { min: 0, max: 100 };
  const nums = vals.filter(v => v !== null);
  if (!nums.length) return {};
  const lo = Math.min(...nums), hi = Math.max(...nums);
  if (hi === lo) return { min: lo - 1, max: hi + 1 };
  const mean = nums.reduce((a, b) => a + b, 0) / nums.length;
  return { min: lo - ((hi - lo) * 12) / 88, max: hi, dim: v => v <= mean };
}

const LANG = new URLSearchParams(location.search).get('lang') || 'en';
function listOf(items) {
  try {
    return new Intl.ListFormat(LANG, { style: 'short', type: 'unit' }).format(items);
  } catch {
    return items.join(', ');
  }
}

const share = d => { const v = reading(d?.usedPct); return v === null ? null : Math.min(v, 100); };

function applyStats(raw) {
  const data = raw && typeof raw === 'object' ? raw : {};
  const byMount = new Map();
  for (const d of Array.isArray(data.disks) ? data.disks : []) if (d && typeof d.mount === 'string') byMount.set(d.mount, d);

  /* A gap longer than the whole chart means every column is from another
     time. Drawing new readings beside them would join two unrelated stretches. */
  const now = Date.now();
  if (lastSampleAt && now - lastSampleAt > tickMs * COLS) for (const h of history) if (h.vals) h.vals = Array(COLS).fill(null);
  lastSampleAt = now;

  const step = Math.max(1, Math.round(tickMs / SEED_STEP_MS));
  const spoken = [];
  rows.forEach((r, i) => {
    const slot = r.slot;
    if (slot.type === 'disk') {
      const p = share(byMount.get(slot.primary || '/'));
      const s = slot.secondary ? share(byMount.get(slot.secondary)) : null;
      r.val.textContent = valueText('disk', p);
      if (r.bar) r.bar.firstElementChild.style.width = (p ?? 0) + '%';
      if (r.bar2) r.bar2.firstElementChild.style.width = (s ?? 0) + '%';
      if (p !== null) spoken.push(`${r.label} ${r.val.textContent}`);
      return;
    }
    seedFromPast(slot, i, data.history, step);
    const v = readingFor(slot, data);
    const h = history[i].vals;
    h.push(v);
    h.shift();
    r.val.textContent = valueText(slot.type, v);
    if (r.chart) r.chart.update(h, scaleFor(slot.type, h));
    if (v !== null) spoken.push(`${r.label} ${r.val.textContent}`);
  });

  /* Slot 4 in Uptime mode reads from the same system poll. */
  const netCfg = cfg.widgetConfig?.network || {};
  if (medium && netCfg.enabled && (netCfg.mode || 'speed') === 'uptime') {
    const up = document.getElementById('net-uptime');
    if (up) up.textContent = reading(data.uptime) === null ? '—' : fmtUptime(data.uptime);
  }

  const sum = document.getElementById('sr-sum');
  if (sum) sum.textContent = listOf(spoken);
}

/* The server omits the seeded past unless this asks for it. */
let wantSeed = true;
async function fetchStats() {
  const d = await fetchData('system', wantSeed ? { params: { seed: '1' } } : {});
  wantSeed = false;
  return d;
}

/* toFixed in the reader's digits. */
const fixed = (v, d) => formatNumber(v, { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: false });

function fmtMbps(v) {
  if (v == null || isNaN(v)) return wt('ui.noData','No data');
  return v >= 1000 ? fixed(v/1000, 1)+' Gbps' : fixed(v, 0)+' Mbps';
}

/* Bytes/second → human rate for the RX/TX throughput mode. */
function fmtRate(bytesPerSec) {
  const v = Number(bytesPerSec);
  if (bytesPerSec == null || isNaN(v)) return '—';
  if (v >= 1024*1024*1024) return fixed(v/(1024*1024*1024), 1)+' GB/s';
  if (v >= 1024*1024)       return fixed(v/(1024*1024), 1)+' MB/s';
  if (v >= 1024)            return fixed(v/1024, 0)+' KB/s';
  return fixed(v, 0)+' B/s';
}

/* Whole seconds → compact uptime label (e.g. "3d 4h", "5h 12m", "8m"). */
function fmtUptime(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const d = Math.floor(sec/86400), h = Math.floor((sec%86400)/3600), m = Math.floor((sec%3600)/60);
  if (d) return `${formatNumber(d)}d ${formatNumber(h)}h`;
  if (h) return `${formatNumber(h)}h ${formatNumber(m)}m`;
  return `${formatNumber(m)}m`;
}

async function fetchThroughput() {
  /* A remote source answers through the widget's own data function. Only this
     machine's traffic comes from the dashboard's cached reading. */
  if (isRemote()) return fetchData('throughput');
  const r = await fetch(`${API}/network-stats`, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  if (!d) throw new Error('no throughput data');
  return d;
}

/* A source reporting totals has no rate to give until it has been read twice. */
function applyThroughput(d) {
  const dn = document.getElementById('net-dn'); if (dn) dn.textContent = d ? fmtRate(d.rx) : '—';
  const up = document.getElementById('net-up'); if (up) up.textContent = d ? fmtRate(d.tx) : '—';
}

async function fetchSpeed() {
  const d = await fetchData('speed');
  if (!d || d.download == null) throw new Error('no speed data');
  return d;
}

function applySpeed(d) {
  const dn = document.getElementById('net-dn'); if (dn) dn.textContent = fmtMbps(d.download);
  const up = document.getElementById('net-up'); if (up) up.textContent = fmtMbps(d.upload);
}

boot();
</script>
</body>
</html>
