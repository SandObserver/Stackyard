<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Stats</title>
<script src="/js/widget-theme.js?v=2551d2fb"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1C1C1E;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  /* Keep #cap outside #widget. Inside it the caption loses the reader's direction. */
  body { display: flex; flex-direction: column; gap: 4px; padding: 16px; }

  .widget { flex: 1; min-height: 0; font-variant-numeric: tabular-nums; }
  .net-item, .sizes { unicode-bidi: plaintext; }
  .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 600; color: #8E8E93; }
  .val { white-space: nowrap; font-weight: 700; line-height: 1.1; color: var(--ink); }

  .size-small { display: flex; flex-direction: column; justify-content: space-evenly; }
  .size-small .row { display: flex; align-items: center; gap: 8px; height: 28px; }
  .size-small .lbl { flex: 1; font-size: 13px; }
  .size-small .val { font-size: 22px; letter-spacing: -0.0118em; }

  .size-medium { display: grid; grid-template-columns: minmax(56px, max-content) minmax(0, 1fr);
    column-gap: 16px; align-content: space-between; align-items: center; }
  .size-medium .row { display: contents; }
  .size-medium .head { display: flex; flex-direction: column; min-width: 0; }
  .size-medium .lbl { max-width: 104px; }
  .size-medium .lbl { font-size: 12px; line-height: 1.2; }
  .size-medium .val { font-size: 20px; letter-spacing: -0.0225em; }
  /* Do not remove. It reserves room for the hover time; without it the charts shift. */
  .sizer { display: flex; flex-direction: column; height: 0; overflow: hidden; visibility: hidden; }
  .plot { height: 100%; max-height: 30px; touch-action: pan-y; }
  .disk { position: relative; touch-action: pan-y; }
  .bars { display: flex; flex-direction: column; gap: 4px; transition: opacity 0.2s ease; }
  .second .tb-bar-fill { opacity: 0.7; }
  .sizes { position: absolute; inset-inline-start: 0; top: 50%; transform: translateY(-50%); opacity: 0;
    font-size: 12px; font-weight: 500; color: #8E8E93; white-space: nowrap; transition: opacity 0.2s ease; }
  .disk.show .bars { opacity: 0; }
  .disk.show .sizes { opacity: 1; }
  .size-small .val.detail { font-size: 13px; font-weight: 600; letter-spacing: 0; color: #8E8E93; }
  .size-small .val.detail.two { display: flex; flex-direction: column; align-items: flex-end;
    font-size: 11px; line-height: 13px; }
  .tb-col-mark { background-color: rgba(255,255,255,0.9); }
  /* Keep the picked colour. The edge is what keeps a colour near the card visible. */
  .faint .tb-col-fill, .faint .tb-bar-fill { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }
  .faint .tb-bar-fill { width: var(--tb-pct); transform: none; transition-property: width !important; }

  .tb-bar, .tb-col { background-color: rgba(255,255,255,0.12); }
  .net { grid-column: 1 / -1; display: flex; gap: 12px; font-size: 11px; font-weight: 500;
    color: #8E8E93; white-space: nowrap; }
  .net-item { display: inline-flex; align-items: center; gap: 2px; }

  html[data-theme="light"], html[data-theme="light"] body { background: #FFFFFF; }
  html[data-theme="light"] .lbl, html[data-theme="light"] .net, html[data-theme="light"] .sizes,
  html[data-theme="light"] .size-small .val.detail { color: #6C6C70; }
  html[data-theme="light"] .tb-col-mark { background-color: rgba(0,0,0,0.75); }
  html[data-theme="light"] .faint .tb-col-fill, html[data-theme="light"] .faint .tb-bar-fill {
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25); }
  @media (prefers-reduced-motion: reduce) { .bars, .sizes { transition: none; } }
  html[data-theme="light"] .tb-bar, html[data-theme="light"] .tb-col { background-color: rgba(0,0,0,0.07); }

  @media (forced-colors: active) {
    .tb-bar, .tb-col { forced-color-adjust: none; background-color: Canvas !important;
      outline: 1px solid CanvasText; outline-offset: -1px; }
    .tb-bar-fill, .tb-col-fill { forced-color-adjust: none; background-color: Highlight !important; }
    .tb-col-mark { forced-color-adjust: none; background-color: CanvasText !important; }
  }
  #ss-link { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; }
  #ss-link:focus-visible { outline: 2px solid #0091FF; outline-offset: -3px; }
  body.linked { cursor: pointer; }
  @media (prefers-contrast: more) {
    .lbl, .sizes, .net, .size-small .val.detail { color: #EBEBF5; }
    html[data-theme="light"] .lbl, html[data-theme="light"] .sizes, html[data-theme="light"] .net,
    html[data-theme="light"] .size-small .val.detail { color: #3C3C43; }
  }
</style>
</head>
<body>
<p id="sr-sum" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:-1px;"></p>
<!-- dir="ltr", not inherited from the page. This widget is percentages, byte
     counts and charts: content with its own direction. Mirroring it runs the
     charts' time axis right to left. -->
<div class="widget" id="widget" aria-hidden="true" dir="ltr"></div>
<div id="cap"></div>
<div id="ss-link" aria-labelledby="sr-sum"></div>
<script type="module" src="widget.js?v=04d40470"></script>
</body>
</html>
