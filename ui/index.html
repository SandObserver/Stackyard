<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">

    <link rel="manifest" href="/manifest.json">
  <!-- Tracks --bg-base. A literal because it is read before any stylesheet. -->
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Not black-translucent. The web view is then placed at the top of the
       screen but still sizes it to the screen minus the status bar, leaving a
       dead strip below the dock in a home-screen install. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stackyard">
  <meta name="mobile-web-app-capable" content="yes">

    <!-- No sizes attribute: the platform accepts any size and scales it -->
  <link rel="apple-touch-icon" href="/icons/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="icon" type="image/png" href="/icons/favicon.png">

  <title>Stackyard</title>
  <link rel="stylesheet" href="/css/tokens.css?v=797311cf">
  <link rel="stylesheet" href="/css/dashboard.css?v=f3f0db0a">
</head>
<body>
<header class="visually-hidden"><h1>Stackyard</h1></header>
<main id="pages" aria-label="Home screen" data-i18n-al="home.homeScreen"></main>
<nav id="dots" aria-label="Dashboard pages" data-i18n-al="home.pagination"></nav>
<!-- Announces the page after a change. The dots are reachable by keyboard. -->
<div id="page-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
<div id="mob-search-pill">
  <div class="msp-search">
    <span class="msp-icon"><svg width="16" height="16" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.4"/><line x1="7.9" y1="7.9" x2="10.5" y2="10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
    <span class="msp-label" data-i18n="home.search">Search</span>
  </div>
  <div class="msp-dots"></div>
</div>
<nav id="dock" aria-label="Dock" data-i18n-al="home.dock"></nav>
<dialog id="spot" aria-label="Search" data-i18n-al="home.searchDialog">
  <div id="sres-live" class="visually-hidden" aria-live="polite"></div>
  <div id="sres"></div>
  <div id="sbox">
    <div class="spot-bar">
      <div class="spot-field">
        <span class="spot-icon"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.6"/><line x1="10.1" y1="10.1" x2="13.5" y2="13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        <input id="sin" type="text" placeholder="Search…" data-i18n-ph="home.searchPh" aria-label="Search apps and folders" data-i18n-al="home.searchInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      </div>
      <button id="spot-cancel" type="button" data-i18n="common.cancel">Cancel</button>
    </div>
  </div>
</dialog>
<script type="module" src="/js/dashboard.js?v=355a3775"></script>
</body></html>
