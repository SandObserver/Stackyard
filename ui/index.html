<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

    <link rel="manifest" href="/manifest.json">
  <!-- Tracks --bg-base. A literal because it is read before any stylesheet. -->
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Not black-translucent. The web view is then placed at the top of the
       screen but still sizes it to the screen minus the status bar, leaving a
       dead strip below the dock in a home-screen install. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stackyard">
  <meta name="mobile-web-app-capable" content="yes">

    <!-- No sizes attribute: the platform accepts any size and scales it -->
  <link rel="apple-touch-icon" href="/icons/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="icon" type="image/png" href="/icons/favicon.png">

  <script src="/js/admin-theme.js?v=66565254"></script>
  <script src="/js/boot-hints.js?v=d40eebe3"></script>
  <script src="/js/page-zoom.js?v=01ccc9cf"></script>
  <title>Stackyard</title>
  <link rel="stylesheet" href="/css/tokens.css?v=42d82f6f">
  <link rel="stylesheet" href="/css/dashboard.css?v=257b9ef3">
  <link rel="stylesheet" href="/css/config-recovery.css?v=9f8ca0ab">
</head>
<body>
<header class="visually-hidden"><h1>Stackyard</h1></header>
<main id="pages" aria-label="Home screen" data-i18n-al="home.homeScreen"></main>
<nav id="dots" aria-label="Dashboard pages" data-i18n-al="home.pagination" hidden></nav>
<!-- Announces the page after a change. The dots are reachable by keyboard. -->
<div id="page-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
<div id="mob-search-pill" role="button" tabindex="0">
  <div class="msp-search">
    <span class="msp-icon"><svg class="sy-icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="#sy-solid-search"/></svg></span>
    <span class="msp-label" data-i18n="home.search">Search</span>
  </div>
  <div class="msp-dots"></div>
</div>
<input id="mob-pager" class="visually-hidden" type="range" tabindex="-1" min="1" max="1" step="1" value="1" aria-label="Page" data-i18n-al="home.pageControl" hidden>
<nav id="dock" aria-label="Dock" data-i18n-al="home.dock"></nav>
<div id="photo-credit" role="group" aria-label="Photo credit" data-i18n-al="home.photoCredit" hidden></div>
<dialog id="spot" aria-label="Search" data-i18n-al="home.searchDialog">
  <div id="sres-live" class="visually-hidden" aria-live="polite"></div>
  <div id="sres"></div>
  <div id="sbox">
    <div class="spot-bar">
      <div class="spot-field">
        <span class="spot-icon"><svg class="sy-icon" width="22" height="22" aria-hidden="true" focusable="false"><use href="#sy-solid-search"/></svg></span>
        <input id="sin" type="text" placeholder="Search…" data-i18n-ph="home.searchPh" aria-label="Search apps and folders" data-i18n-al="home.searchInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      </div>
      <button id="spot-cancel" type="button" data-i18n="common.cancel">Cancel</button>
    </div>
  </div>
</dialog>
<script type="module" src="/js/dashboard.js?v=5e3b354e"></script>
</body></html>
